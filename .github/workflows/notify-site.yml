# Tells the project's website that a release is out. The site's deploy follows OME's latest release: it exports each
# game with that release's exporter and builds with its reference bundle (the site's plan §15, in its repository), so
# a release starts it with no other step. This runs once the release workflow has finished successfully for a tag. The
# release workflow itself holds no secret (tools/test_release_workflow.py); this one holds the one key it needs.
#
# It needs the repository variables SITE_REPOSITORY (the site repository's owner/name) and SITE_DISPATCH_APP_CLIENT_ID,
# and the secret SITE_DISPATCH_APP_KEY: the client ID and a private key of a GitHub App with Contents: write, installed
# on the site's repository. Each run makes from them a token that lasts an hour, may write only that repository's
# contents (which a dispatch event needs) and is revoked when the job ends. Without SITE_REPOSITORY it does nothing.
name: Notify the site

on:
  workflow_run:
    workflows: ["Release builds"]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    name: Start the site's deploy
    if: >-
      vars.SITE_REPOSITORY != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Context values reach the scripts as environment variables, never as text spliced into them.
      - name: Read the site repository's owner and name
        id: site
        env:
          SITE_REPOSITORY: ${{ vars.SITE_REPOSITORY }}
        run: |
          echo "owner=${SITE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SITE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Make a token for the site's repository
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SITE_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITE_DISPATCH_APP_KEY }}
          owner: ${{ steps.site.outputs.owner }}
          repositories: ${{ steps.site.outputs.name }}
          permission-contents: write

      - name: Send the site an ome-release event
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SITE_REPOSITORY: ${{ vars.SITE_REPOSITORY }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh api --method POST "repos/$SITE_REPOSITORY/dispatches" \
            -f event_type=ome-release -f "client_payload[tag]=$RELEASE_TAG"
          echo "sent ome-release $RELEASE_TAG to $SITE_REPOSITORY"
