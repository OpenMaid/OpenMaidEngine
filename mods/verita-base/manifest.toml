omp = 5
id = "verita-base"
name = "戦女神VERITA base"
version = "1.0.0"
description = "Names the game's cells for Lua mods (the layout the engine builds a mod's game.g and game.table from), gives a helper that changes the game through its own scripts, and carries the game's OMS toolchain (oms/)."

[game]
profile = "verita"
target = "extended"

[lua]
api = 1
capabilities = ["vm"]
# The game scripts the helpers in lua/init.lua call (spec §10); omp check walks each.
calls = ["ADDITEM"]

# The library tables.lua applies the record tables with (data patches spec §6.4); the engine ships it too.
[[requires]]
id = "ome-records"
version = ">=1, <2"

# Data files of the game's record tables (data patches spec §6): a mod that requires this base mod ships them under
# data/, and tables.lua checks and applies each, by the record map lua/generated/tables.lua: the boot's tables at
# verita.data.layered, and a dungeon map's blocks each time their loaders have run (verita.map.loaded, and
# verita.data.ready after a load of a save made on the map). The link checks each file against
# shapes/tables.schema.json first, which base_mod_build.py generates from the same record map (spec §7).
[[accepts]]
kind = "verita.tables"
description = "Edits to the game's record tables: units, characters, titles, items, skills, routines and the world's places, which the boot builds, and each dungeon map's blocks, which its loaders write."
shape = "tables.schema.json"

[[accepts.at]]
event = "verita.data.layered"
handler = "tables.lua:apply_boot"

[[accepts.at]]
event = "verita.map.loaded"
handler = "tables.lua:apply_dungeon"

[[accepts.at]]
event = "verita.data.ready"
handler = "tables.lua:apply_loaded_dungeon"
