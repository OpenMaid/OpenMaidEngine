# The boot's data (Lua scripting spec §9.2). Hand-written: each event names its point and gives each field's cell, by the
# names layout/globals.json exports.

[[event]]
name = "bg0.data.layered"
point = "bg0.boot.data_layered"
description = """
At boot, once every layer has written its data tables (the base layer's, then the append's) and before the boot uses \
them. An edit made here lands where the append's edit lands, and the boot's own work then runs over it as it runs \
over the append's: INIT2 writes its constants (among them world_map_pictures and character_sort_keys, which an edit \
here does not keep), gives a game with no formation the first one, and runs CALCREVISE for each joined character, \
which reads the skills and items. A handler that edits a table (a unit, an item, a condition) changes it until the \
tables are built again. The boot tables are not saved: a load builds them again and raises this again while it \
restores (maid.session.restoring is true), so the handler makes its edit again. The data files of bg0.tables are \
applied here, among this event's handlers in the mods' load order, so a handler here takes its place among them."""

[[event]]
name = "bg0.data.ready"
point = "bg0.boot.data_ready"
description = """
At boot, once every data table is built and the boot's own work on them is done: INIT2 has written its constants \
and rebuilt each joined character's values (CALCREVISE). An edit made here comes after that work, which does not see \
it: bg0.data.layered comes before it. A handler here runs after every data file of bg0.tables, whatever the load \
order, because this event comes later in the boot; one that should take its place among them by load order \
subscribes to bg0.data.layered instead. The tables are not saved: a load builds them again and raises this again \
while it restores (maid.session.restoring is true), so the handler makes its edit again. For a save made in a scene \
after a map (system_mode 1, map_entered set), the game's load callback has set the map's blocks up again before this \
(CALLBACK_LOAD), and the data files of bg0.tables write their parts for that map here."""
