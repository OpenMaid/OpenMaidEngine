# One experience award (Lua scripting spec §9.2). Hand-written: the event names its point and gives each field's cell,
# by the names layout/globals.json exports.

[[event]]
name = "bg0.experience.award"
point = "bg0.experience.before_add"
description = """
One character's experience award, before ADDEXP adds it: from a won battle (RESULT, for each character in the \
party whose experience from the battle is not 0, those who did not fight included), and from the map events, scenes \
and FIELD, which call ADDEXP too. ADDEXP gives experience only to a \
character in the party, so this is raised only for one. A handler that changes amount changes what is added; the \
levels it brings are worked out from it after the handler (セリカ, character 1, keeps his experience and gains no \
level from it)."""

[[event.field]]
name = "amount"
at = "script_arg_1"             # ADDEXP's input: the experience its caller set just before calling it
type = "int"
access = "rw"

[[event.field]]
name = "character"
at = "character_arg_id"         # the character the award goes to
type = "int"
access = "r"

[[event.field]]
name = "level"
at = "character_levels[character_arg_id]"
type = "int"
access = "r"
