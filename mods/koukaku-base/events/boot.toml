# The boot's data (Lua scripting spec §9.2). Hand-written: each event names its point and gives each field's cell, by the
# names layout/globals.json exports.

[[event]]
name = "koukaku.data.layered"
point = "koukaku.boot.data_layered"
description = """
At boot, once every layer has written its data tables (the 37 base tables, INIT2's hook chains and constants, then \
the append's $1$AUTORUN and its layers) and before INIT2's last work: giving the shared profile CVINIT's colour where \
it has none, and, on a load inside a scene over the map, rebuilding the screen beneath from the saved state. An edit \
made here lands where the append's edits land. A handler that edits a table (a character, an item, a troop, a \
region) changes it until the tables are built again. The boot tables are not saved: a load builds them again and \
raises this again while it restores (maid.session.restoring is true), so the handler makes its edit again. What the \
game copies from a table into saved cells (a costume's starting parts and stats when ADDPART first adds it, a \
region's preset objects at its first setup) keeps the value it copied. The data files of koukaku.tables are applied \
here, among this event's handlers in the mods' load order, so a handler here takes its place among them."""

[[event]]
name = "koukaku.data.ready"
point = "koukaku.boot.data_ready"
description = """
At boot, once every data table is built and INIT2's own work on them is done: the colours, and on a load inside a \
scene over the map the rebuilt screen, which does not see an edit made here: koukaku.data.layered comes before it. A \
handler here runs after every data file of koukaku.tables, whatever the load order, because this event comes later \
in the boot. The tables are not saved: a load builds them again and raises this again while it restores \
(maid.session.restoring is true), so the handler makes its edit again."""
