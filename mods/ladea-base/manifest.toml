omp = 5
id = "ladea-base"
name = "天秤のLa DEA。 base"
version = "1.0.0"
description = "Names the game's cells for Lua mods (the layout the engine builds a mod's game.g and game.table from), gives helpers that change the game through its own scripts, and carries the game's OMS toolchain (oms/)."

[game]
profile = "ladea"
target = "extended"

[lua]
api = 1
capabilities = ["vm"]
# The game scripts the helpers in lua/init.lua call (spec §10); omp check walks each.
calls = ["ADDITEM"]

# The library tables.lua applies the record tables with (data patches spec §6.4); the engine ships it too.
[[requires]]
id = "ome-records"
version = ">=1, <2"

# Data files of the game's record tables (data patches spec §6): a mod that requires this base mod ships them under
# data/, and tables.lua checks and applies each, by the record map lua/generated/tables.lua: the boot's tables at
# ladea.data.layered, a dungeon floor's object slots each time FIELD has walked the FLINIT chain
# (ladea.floor.loaded), and a town place's spots each time SETORNDATA has walked the ORINIT chain
# (ladea.town.place_loaded). The link checks each file against shapes/tables.schema.json first, which
# base_mod_build.py generates from the same record map (spec §7).
[[accepts]]
kind = "ladea.tables"
description = "Edits to the game's record tables: characters, skills, conditions, items, stones, improvement and alchemy, the dungeon's floors, map blocks, objects and puzzles, the town's buildings, quests, rites and unlocks, the encounters and the galleries, which the boot builds, and a dungeon floor's object slots and a town place's spots, which their loaders write."
shape = "tables.schema.json"

[[accepts.at]]
event = "ladea.data.layered"
handler = "tables.lua:apply_boot"

[[accepts.at]]
event = "ladea.floor.loaded"
handler = "tables.lua:apply_floor"

[[accepts.at]]
event = "ladea.town.place_loaded"
handler = "tables.lua:apply_place"
