# The boot's data (Lua scripting spec §9.2). Hand-written: each event names its point and gives each field's cell, by the
# names layout/globals.json exports.

[[event]]
name = "ladea.data.layered"
point = "ladea.boot.data_layered"
description = """
At boot, once every layer has written its data tables (the 34 base tables, INIT2's hook chains and constants, then \
the two appends' $1$AUTORUN and $2$AUTORUN and their layers) and before INIT2's last work: giving the shared profile \
CVINIT's colour where it has none, rebuilding what lies beneath on a load inside an event CG or a scene over the \
field or the town, and clearing the negative item counts. An edit made here lands where the appends' edits land. A \
handler that edits a table (a character, an item, a stone, a quest) changes it until the tables are built again. \
The boot tables are not saved: a load builds them again and raises this again while it restores \
(maid.session.restoring is true), so the handler makes its edit again. What the game copies from a table into saved \
cells keeps the value it copied: a character's start (level, equipment, items) when UNITECH first adds the character \
to the party. The data files of ladea.tables are applied here, among this event's handlers in the mods' load order, \
so a handler here takes its place among them."""

[[event]]
name = "ladea.data.ready"
point = "ladea.boot.data_ready"
description = """
At boot, once every data table is built and INIT2's own work on them is done: the colours, on a load inside an event \
CG or a scene over the field or the town the rebuilt screen, which does not see an edit made here (ladea.data.layered \
comes before it), and the item counts. A handler here runs after every data file of ladea.tables, whatever the load \
order, because this event comes later in the boot. The tables are not saved: a load builds them again and raises \
this again while it restores (maid.session.restoring is true), so the handler makes its edit again."""
