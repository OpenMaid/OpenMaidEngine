attack_element_encoded = "The element it attacks with; a skill without one takes its weapon's. Omni (無属) is the one no unit resists or is weak to: it always deals full damage."
condition_levels = "The level of each condition it inflicts."
resource_deltas = "HP (the amount healed, on a healing skill), SP (a negative number is its cost) and FS."

[kind.labels]
