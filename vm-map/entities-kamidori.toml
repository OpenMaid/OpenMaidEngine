# Kamidori's entity declarations: what the project site publishes of the game's data (game data export spec §5).
# Hand-edited; tools/entities_build.py checks it against vm-map/globals-kamidori.toml (its tables, their
# [table.refs], its globals), vm-map/patch-points-kamidori.toml and the profile's saved prefix, and writes
# build/games/kamidori/entities.json for the exporter.
#
# Scripts are named without the `$n$` prefix of an update or append and without `.BIN`. Fields are named as the record
# map names them, a column by its name after a dot. A field left out of a kind is still in the modder data.
#
# The story flags and scene numbers that gate a record (a quest's appear flags, a recipe's unlock flags, a glossary
# entry's scenes) are left out: their numbers mean nothing to a reader, so they are modder data only (the user,
# 2026-11-22). A group shows published rows of cells of one width as one table, a row for each element.
#
# A note explains a detail to a reader in a line (the user, 2026-11-22): it says only what the registry's value domain
# and usage establish for the field's global, in plain words, and only where the label and value leave a reader
# guessing.

[export]
# The tables as the game plays with them: INIT2's exit, after every layer (spec §14, answer 2).
boot = { script = "INIT2", read_at = "kamidori.boot.data_ready" }
# The scripts whose stored values may be published: INIT2 itself (it stores table literals), the *INIT and *INIT2
# table scripts and their `$n$` updates, and AUTORUN, which the appends run.
builders = ["INIT2", "*INIT", "*INIT2", "AUTORUN"]
# Never builders, whatever matches them: the CG gallery, the H-scene replays and the event-CG substitution.
excluded_builders = ["CGINIT", "SPINIT", "EVINIT"]
# The information screens whose shown text is data (spec §5.7, §14 answer 6): item and skill descriptions, the
# glossary, character profiles, chapter objectives.
text_scripts = ["ITMES", "SKMES", "VIMES", "CIMES", "FAMES"]
# The pictures the site shows blurred until a click (the user, 2026-11-21): nudity, by catalog name. Found by looking
# at every picture the declarations publish: the eleven clothing-damaged battle pictures (`CB…AAB`) and three of the
# base battle art. Suggestive but covered art (CB551AAA, CB311AAA, CB016AAA) is not on the list.
explicit_pictures = ["CB*AAB", "CB052AAA", "CB504AAA", "CB505AAA"]

[[kind]]
id = "item"
table = "item"
exists = "name"
title = "name"
text = ["short_description"]
fields = [
    "category", "rank", "sort_key", "price", "attack_element", "min_range", "max_range", "stat_modifiers",
    "critical_rate_bonus", "affinity_level_deltas", "condition_level_deltas", "equipped_condition_levels",
    "granted_skill_id", "resource_recovery_amounts", "cursed_flag", "sex_restriction_mask", "character_whitelist",
    "costume_battle_variant", "growth_enabled", "garden_product_item_id", "garden_production_period",
    "furniture_area", "furniture_exclusive_group", "furniture_width", "furniture_height",
    "furniture_sales_count_bonus", "furniture_purchase_desire_bonus", "furniture_visit_rate_bonus",
    "furniture_high_price_bonus", "furniture_equipment_bonus", "furniture_information_bonus",
    "furniture_mutation_bonus", "furniture_knowledge_bonus", "furniture_staff_count_bonus", "furniture_garden_bonus",
]
filters = ["category", "rank", "attack_element"]
pictures = { icon = "icon_asset_id", furniture = "furniture_sprite_asset_id" }

[kind.notes]
price = "Buy is what a shop charges for it, sell what a vendor pays for it, and retail the base price it sells for in the player's own shop."
affinity_level_deltas = "The steps it moves each element's resistance while equipped: +1 is one step more resistant."
condition_level_deltas = "The level it changes each condition by: -5 clears the condition, and a positive number inflicts it or raises it."
equipped_condition_levels = "The level of each condition its wearer has while it is equipped."
resource_recovery_amounts = "The HP, SP and FS it restores; 999 restores them in full."
cursed_flag = "1: a cursed item, which cannot be unequipped."
character_whitelist = "The characters allowed to equip or use it, up to five."
growth_enabled = "1: the item gains growth experience as it is used."
furniture_area = "The room it goes in: 1 the shop, 2 the workshop, 3 the room, 4 the garden."
furniture_width = "In tiles."
furniture_height = "In tiles."

[[kind.description]]
name = "description"
script = { field = "handler_script_id" }        # ITMES or a `$n$ITMES`, as SHOP calls it
seed = { current_item_id = "key" }

[[kind]]
id = "unit"
table = "unit"
exists = "full_name"
title = "full_name"
text = ["display_name", "initial_class_title", "bestiary_description"]
fields = [
    "race", "sex", "boss_class", "sort_key", "bestiary_listed", "starting_level", "level_cap", "stats",
    "stat_growth", "initial_stat_caps", "element_resistance", "equippable_category_mask", "initial_weapon_level",
    "default_attack_item_id", "initial_equipment", "default_costume_item_id", "skill", "party_cost",
    "initial_affinity_tenths", "experience_reward", "bestiary_knowledge_gain", "drop_item", "drop_chance",
    "habitat_area",
]
filters = ["race", "sex", "boss_class"]

[[kind.group]]
name = "stat_table"
fields = ["stats", "stat_growth", "initial_stat_caps"]

[[kind.group]]
name = "drops"
fields = ["drop_item", "drop_chance"]

[kind.notes]
sex = "1 male, 2 female, 3 other or none."
bestiary_listed = "1: the bestiary lists it."
stat_table = "Stats are its base values at its starting level, growth what it gains each level in hundredths of a point, and the caps a playable character's own ceilings (0 uses the game's common cap)."
element_resistance = "Each element's resistance step, from -5 (weakest) to 4 (strongest); 5 is immune and 6 absorbs."
initial_affinity_tenths = "Its starting affinity divided by ten: 30 is an affinity of 300."
drops = "Each item it can drop and the percent chance; a chance of 5 or less counts as a rare drop."
habitat_area = "The world areas the bestiary lists as where it lives."

# The user's choice (spec §5.4): the face, the bestiary sprite and the battle sprites. The registry names the columns
# from file prefixes. Milestone 1 looked at each column's pictures (2026-11-21): face is the party list's face plate
# with the name (47 units); sprite the map's four-frame walking sheet; battle_1 the battle art (AAA); battle_2 and
# battle_3 are AAA too, except for 28 units whose AAB variant is the clothing-damaged art, which is explicit (see
# [export] explicit_pictures); battle_face a close-up face (AB).
[kind.pictures]
face = "graphic.face_CA_AA"
sprite = "graphic.map_sprite_compact_CP_AA"
battle_1 = "graphic.battle_sprite_1_CB_AAA"
battle_2 = "graphic.battle_sprite_2_CB_AAA_or_AAB"
battle_3 = "graphic.battle_sprite_3_CB_AAA_or_AAB"
battle_face = "graphic.battle_sprite_CB_AB"

[[kind]]
id = "skill"
table = "skill"
exists = "name"
title = "name"
text = ["short_description"]
fields = [
    "category", "sort_key", "catalog_visible", "equip_cost", "upgrade_family_id", "bundled_skill_ids",
    "min_range_encoded", "max_range_encoded", "required_weapon_category_mask", "area_target_mode", "area_shape_id",
    "area_cooldown_turns", "attack_element_encoded", "condition_levels", "combat_stat_deltas", "critical_rate_bonus",
    "resource_deltas", "proc_chance_percent",
]
filters = ["category"]
pictures = { icon = "icon_asset_id" }

[kind.notes]
min_range_encoded = "Its range plus one, as the game stores it: 1 is adjacent."
max_range_encoded = "Its range plus one, as the game stores it."
attack_element_encoded = "Its element plus one, from 2 (physical) to 8 (dark); 0 uses the weapon's element."
condition_levels = "The level of each condition it inflicts."
resource_deltas = "HP (the amount healed, on a healing skill), SP (a negative number is its cost) and FS."

[[kind.description]]
name = "description"
script = { field = "handler_script_id" }        # SKMES or a `$n$SKMES`, as INFO6 calls it
seed = { current_skill_id = "key" }

# Game data export milestone 2 (plan §4.1): more of the boot's tables.

[[kind]]
id = "quest"
table = "quest"
exists = "name"
# The 20 仮 placeholders, which no flag ever posts: their first appear flag is 10000.
skip = { "appear_required_flags.required_flag_1" = 10000 }
title = "name"
text = ["description_lines", "requester_name", "category_label"]
fields = [
    "sort_key", "difficulty_stars", "deadline_days", "reward_money", "reputation_reward", "reward_item_ids",
    "reward_item_quantities", "prerequisite_quest_id",
]
filters = ["difficulty_stars"]
pictures = { requester = "requester_icon_asset_id" }

[[kind.group]]
name = "reward_items"
fields = ["reward_item_ids", "reward_item_quantities"]

[kind.notes]
deadline_days = "The days allowed to finish it; 0 is no deadline."

# INFO2@0x1171 draws lines 0 to 4 as one block, 5 and 6 under 達成条件 and 7 and 8 under 失敗条件
# (quest_description_lines in the registry). The English package fills lines 0 to 4 as one paragraph.
[kind.text_blocks.description_lines]
overview = [0, 4]
clear_condition = [5, 6]
failure_condition = [7, 8]

[[kind]]
id = "recipe"
table = "recipe"
exists = "output_item_id"
# A recipe has no name of its own: the game lists it by the item it makes.
title = "output_item_id"
text = ["unlock_text"]
fields = [
    "output_item_id", "ingredient_item_ids", "ingredient_quantities", "evaluation_reward", "mutation_chance",
    "mutation_item_id", "quest_marker", "required_synthesis_rank", "unlock_craftsman_rank", "unlock_synthesis_rank",
    "unlock_shop_level", "unlock_workshop_level", "unlock_quarters_level", "unlock_room4_level", "unlock_knowledge",
    "unlock_sense", "unlock_grown_item_id", "unlock_prerequisite_recipe_id",
]
filters = ["unlock_craftsman_rank", "unlock_synthesis_rank"]

[[kind.group]]
name = "ingredients"
fields = ["ingredient_item_ids", "ingredient_quantities"]

[kind.notes]
evaluation_reward = "Evaluation points: in full for the first craft, and a tenth of them for each craft after."
mutation_chance = "The percent chance that a craft mutates into the mutation item, before the studio's multiplier."
quest_marker = "1: the invention a quest asks for."
unlock_craftsman_rank = "The craftsman rank needed to learn it, from 0 (新米) to 10 (匠王)."
unlock_synthesis_rank = "The synthesis rank needed to learn it: 0 is E, then D, C, B, A, and 5 is S."
unlock_grown_item_id = "Equipment that must be fully grown first."

[[kind]]
id = "condition"
table = "condition"
exists = "level_names.level_1"
# A condition is named by its levels (猛毒1 to 猛毒5); the first names it.
title = "level_names.level_1"
text = ["level_names"]
fields = [
    "susceptibility_group", "immunity_skill_id", "can_affect_bosses", "cleared_by_recover", "duration_turns",
    "stat_deltas", "critical_rate_delta", "resource_deltas",
]
filters = ["susceptibility_group"]

# A row for each of the five levels: its turns, its nine stat changes and its three resource changes.
[[kind.group]]
name = "levels"
fields = ["duration_turns", "stat_deltas", "resource_deltas"]

# The status icon: icon_id numbers a 15-pixel cell of SO009's sheet, ten to a row from (0, 941) in steps of 16, as
# DRAWCHSTATE@0x1aa to 0x205 cuts it (checked against each condition's name, 2026-11-22). Death and the three drains
# have icon 0, which is none.
[kind.pictures.icon]
field = "icon_id"
sheet = "SO009.AGF"
first = 1
columns = 10
origin = [0, 941]
step = [16, 16]
size = [15, 15]

[kind.notes]
susceptibility_group = "Which of a race's resistances the chance to catch it is rolled against: each race has a percent chance for each group, 0 meaning immune. 1 curse, 2 death and fear, 3 charm and confusion, 4 paralysis and poison, 5 drains, 6 water, acid and inflammation, 7 buffs and others."
levels = "Each level's turns (-1 lasts until cleared), its stat changes, and its HP, SP and FS changes each turn: a drain's are the percent it steals, poison's and acid's are losses."
critical_rate_delta = "The change at level 5; a lower level gives its share (level / 5)."

[[kind]]
id = "stage"
table = "stage_catalog"
exists = "name"
title = "name"
# The select screen's backdrop (select_background_asset_id) is not published: it is a whole background.
fields = [
    "labyrinth_id", "floor_number", "sort_key", "recommended_level", "boss_flag", "event_entry_flag",
    "prerequisite_labyrinth_id", "prerequisite_floor_number", "required_party_unit_ids", "objective_money_rewards",
    "objective_item_rewards", "objective_evaluation_rewards", "objective_bonus_point_rewards",
]
filters = ["labyrinth_id", "boss_flag"]

# A row for each goal of the stage, labelled by the goal's text as the stage's loader writes it (reward.condition_text
# below; the user, 2026-11-22).
[[kind.group]]
name = "objective_rewards"
fields = ["objective_money_rewards", "objective_item_rewards", "objective_evaluation_rewards",
          "objective_bonus_point_rewards"]
labels = "reward.condition_text"

[kind.notes]
labyrinth_id = "The world area whose stage list has it."
boss_flag = "1: a boss stage, whose name is set between ◆ marks."
event_entry_flag = "1: choosing it plays an event instead of a battle map."
prerequisite_labyrinth_id = "With the prerequisite floor, the stage that must be cleared first."
required_party_unit_ids = "Units that must be in the sortie: the first five before its first clear, the other five once it is cleared or on a boss stage."
objective_rewards = "What each goal of the stage gives, by the goal as the game words it."

# The dig tables are not published (the user, 2026-11-22): a table is reached only through a floor's dig points, the
# map objects of a stage, which no loader publishes yet, so its page could not say where it is dug. They go with the
# stage maps (docs/backlog.md).

# The world areas (the user, 2026-11-22): the places of the world map, which a stage's labyrinth and a unit's habitat
# name. Their map position is modder data.
[[kind]]
id = "world_area"
table = "world_area"
exists = "name"
title = "name"
fields = ["area_type", "travel_days"]
filters = ["area_type"]
pictures = { picture = "picture_asset_id" }

[kind.notes]
area_type = "1: a labyrinth, which lists stages to enter; 2: a town or facility."
travel_days = "The days that pass in travelling there; once 30 days have passed, the party must return home."

[[kind]]
id = "character_profile"
table = "character_profile"
exists = "name"
title = "name"
text = ["epithet", "race_text", "sex_text"]
fields = ["sort_key", "unit_id"]
# The portrait is the standing art the profile screen shows (CS…AAA); the user chose to publish it (plan §4.1).
pictures = { portrait = "portrait_asset_id" }

[[kind.description]]
name = "biography"
script = { field = "biography_script_id" }      # CIMES, as INFO7 calls it
seed = { character_profile_selected_id = "key" }

[[kind]]
id = "objective"
table = "objective"
exists = "text"
title = "text"
text = ["chapter_label"]
fields = ["sort_key"]

[[kind.description]]
name = "message"
script = { field = "message_script_id" }        # FAMES, as INFO1 calls it
seed = { current_objective_id = "key" }

[[kind]]
id = "glossary_entry"
table = "glossary_entry"
exists = "name"
title = "name"
fields = ["sort_key"]

[[kind.description]]
name = "explanation"
script = { field = "message_script_id" }        # VIMES, as INFO8 calls it
seed = { current_vocabulary_id = "key" }

# The stage loaders (export plan §4.2): FIELD runs a stage's loaders (STINIT and its layers' $n$STINIT) just before
# kamidori.stage.after_loader. party_on_field 1 skips the arrival block, whose scenes can leave FIELD first
# (FIELD@0x1ef to 0x304); the 38 event-entry stages have no map.
[[loader]]
scope = "stage"
keys = "stage"
skip = { event_entry_flag = 1 }
script = "FIELD"
seed = { current_stage_id = "key", field_map_continue_mode = 0, party_on_field = 1 }
read_at = "kamidori.stage.after_loader"

[loader.tables.enemy]
exists = "unit_id"
fields = ["unit_id", "min_level", "max_level", "auto_level_scale_divisor", "faction_id", "difficulty_mask",
          "first_visit_only", "random_selection_weight", "spawn_tile_x", "spawn_tile_y", "spawn_object_slot",
          "movement_routine_set_ids", "battle_routine_set_ids"]

# The goals the stage's rewards are for, which label the stage's objective_rewards rows. STINIT leaves the first
# goal's text empty: AIM@0x5b4 and STAGECLEAR@0x8be draw a fixed text in its place, which a literal gives.
[loader.tables.reward]
exists = "condition_text"
text = ["condition_text"]
literals = [{ record = 0, field = "condition_text", script = "AIM", offset = 0x5b4 }]

# The title changes (the user, 2026-11-22): CCINIT's rules (and each append's), as CALCCC adds them up. A run for each
# rule column of a character: every other column marked applied, this one marked event-unlocked and not applied, the
# character at level 99, so that only that column's rule can fire, whether a level or an event gives it (no rule has
# both, and no two share a character and column, 2026-11-22). What it gives is read before CALCCC applies it. A
# variant unit (unit_canonical_character_id) has no rules of its own, so no rows. No scope: no data file edits what a
# class change gives (the registry's class_change table).
[[loader]]
keys = "unit"
key_range = [1, 99]
steps = 20
script = "CALCCC"
seed = [
    { global = "current_character_id", value = "key" },
    { global = "character_levels", index = ["key"], value = 99 },
    { global = "character_class_change_state", index = ["key", "*"], value = 1 },
    { global = "character_class_change_state", index = ["key", "step"], value = 2 },
]
read_at = "kamidori.class_change.rules_run"
# CALCCC zeroes the block before the rules add to it, so a delta no rule touches is CALCCC's zero.
builders = ["CALCCC"]

[loader.tables.title_change]
table = "class_change"
exists = "title_level"
text = ["title"]
fields = ["title_level", "party_cost_delta", "party_capacity_delta", "stat_deltas", "stat_cap_deltas",
          "resistance_deltas", "skill_slot_replacements"]
notes = { title_level = "The level the title comes at; -1: a story event gives it." }

# The script relations (spec §6.7, export plan §4.5): where a scene sets a script's arguments to constants and calls it.
# ADDITEM gives or takes an item by the sign of its count (docs/kamidori-data-tables.md, Giving and taking).
[[script_relation]]
id = "given_in"
negative = "taken_in"
call = "ADDITEM"
kind = "item"
key = "current_item_id"
count = "current_item_count_change"
exclude = ["DEBUG*"]

# UNITECH joins the units of its lists (Joining the party). Every caller joins one unit, entry 0, which `where` checks.
[[script_relation]]
id = "joins_in"
call = "UNITECH"
kind = "unit"
key = "joining_unit_ids"
where = { joining_unit_count = 1 }
exclude = ["DEBUG*"]
