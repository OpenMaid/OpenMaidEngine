# Game data export milestone 2 (plan §4.1): more of the boot's tables.

[[kind]]
id = "quest"
table = "quest"
about = "Journal quests and reward notices: what each asks, its difficulty and deadline, its rewards, and the quest that must come first."
exists = "name"
# The 20 仮 placeholders, which no flag ever posts: their first appear flag is 10000.
skip = { "appear_required_flags.required_flag_1" = 10000 }
title = "name"
text = ["description_lines", "requester_name", "category_label"]
fields = [
    "difficulty_stars", "deadline_days", "reward_money", "reputation_reward", "reward_item_ids",
    "reward_item_quantities", "prerequisite_quest_id",
]
filters = ["difficulty_stars"]
qualifiers = ["requester_name"]
pictures = { journal_icon = "journal_icon_asset_id" }

[[kind.group]]
name = "reward_items"
fields = ["reward_item_ids", "reward_item_quantities"]

[kind.notes]
deadline_days = "The days allowed to finish it."

[kind.labels]
reward_item_ids = "Item"
reward_item_quantities = "Quantity"

[kind.referenced_as]
reward_item_ids = { heading = "Rewarded by quests", details = ["reward_item_quantities"] }

# INFO2@0x1171 draws lines 0 to 4 as one block, 5 and 6 under 達成条件 and 7 and 8 under 失敗条件
# (quest_description_lines in the registry). The English package fills lines 0 to 4 as one paragraph.
[kind.text_blocks.description_lines]
overview = [0, 4]
clear_condition = [5, 6]
failure_condition = [7, 8]

[[kind]]
id = "recipe"
table = "recipe"
about = "Alchemy recipes: the item each makes, its ingredients, what unlocks it, and the chance it makes something else."
exists = "output_item_id"
# A recipe has no name of its own: the game lists it by the item it makes.
title = "output_item_id"
text = ["unlock_text"]
fields = [
    "output_item_id", "ingredient_item_ids", "ingredient_quantities", "evaluation_reward", "mutation_chance",
    "mutation_item_id", "quest_marker", "unlock_craftsman_rank", "unlock_synthesis_rank",
    "unlock_shop_level", "unlock_workshop_level", "unlock_quarters_level", "unlock_knowledge",
    "unlock_sense", "unlock_grown_item_id", "unlock_prerequisite_recipe_id",
]
filters = ["unlock_craftsman_rank", "unlock_synthesis_rank"]

[[kind.group]]
name = "ingredients"
fields = ["ingredient_item_ids", "ingredient_quantities"]

[kind.notes]
evaluation_reward = "Evaluation points: in full for the first craft, and a tenth of them for each craft after."
mutation_chance = "The chance that a craft mutates into the mutation item, before the studio's multiplier."
quest_marker = "The invention a quest asks for."
unlock_craftsman_rank = "The craftsman rank needed to learn it."
unlock_synthesis_rank = "The synthesis rank needed to learn it."
unlock_grown_item_id = "Equipment that must be fully grown first."

[kind.labels]
quest_marker = "Quest invention"
ingredient_item_ids = "Item"
ingredient_quantities = "Quantity"

[kind.referenced_as]
output_item_id = "Made by recipe"
ingredient_item_ids = { heading = "Ingredient in", details = ["ingredient_quantities"] }
mutation_item_id = { heading = "Crafts that may mutate into it", details = ["mutation_chance"] }
unlock_grown_item_id = "Growing it fully unlocks"
unlock_prerequisite_recipe_id = "Must be learned before"

[[kind]]
id = "condition"
table = "condition"
about = "The conditions a unit can have in battle, each with five levels: what each level changes, how long it lasts, and what resists it."
exists = "level_names.level_1"
# A condition is named by its levels (猛毒1 to 猛毒5); the first names it.
title = "level_names.level_1"
text = ["level_names"]
fields = [
    "susceptibility_group", "immunity_skill_id", "can_affect_bosses", "cleared_by_recover", "duration_turns",
    "stat_deltas", "critical_rate_delta", "resource_deltas",
]
filters = ["susceptibility_group"]

# A row for each of the five levels: its turns, its nine stat changes and its three resource changes.
[[kind.group]]
name = "levels"
fields = ["duration_turns", "stat_deltas", "resource_deltas"]

# The status icon: icon_id numbers a 15-pixel cell of SO009's sheet, ten to a row from (0, 941) in steps of 16, as
# DRAWCHSTATE@0x1aa to 0x205 cuts it (checked against each condition's name, 2026-11-22). Death and the three drains
# have icon 0, which is none.
[kind.pictures.icon]
field = "icon_id"
sheet = "SO009.AGF"
first = 1
columns = 10
origin = [0, 941]
step = [16, 16]
size = [15, 15]

[kind.notes]
susceptibility_group = "Which of a race's resistances the chance to catch it is rolled against: each race has a percent chance for each group, 0 meaning immune."
levels = "Each level's turns, its stat changes, and its HP, SP and FS changes each turn: a drain's are the percent it steals, poison's and acid's are losses."
critical_rate_delta = "The change at level 5; a lower level gives its share (level / 5)."

[kind.labels]
susceptibility_group = "Resisted as"
can_affect_bosses = "Affects bosses"
cleared_by_recover = "Cleared by recovery"

[kind.referenced_as]
immunity_skill_id = "Gives immunity to"

[[kind]]
id = "stage"
table = "stage_catalog"
about = "Every stage of every labyrinth: its floor and recommended level, the enemies on it, its objectives' rewards, and what opens it."
exists = "name"
title = "name"
# The select screen's backdrop (select_background_asset_id) is not published: it is a whole background.
fields = [
    "labyrinth_id", "floor_number", "recommended_level", "boss_flag", "event_entry_flag",
    "prerequisite_labyrinth_id", "prerequisite_floor_number", "required_party_unit_ids", "objective_money_rewards",
    "objective_item_rewards", "objective_evaluation_rewards", "objective_bonus_point_rewards",
]
filters = ["labyrinth_id", "boss_flag"]
qualifiers = ["labyrinth_id", "floor_number"]

# A row for each goal of the stage, labelled by the goal's text as the stage's loader writes it (reward.condition_text
# below; the user, 2026-11-22).
[[kind.group]]
name = "objective_rewards"
fields = ["objective_money_rewards", "objective_item_rewards", "objective_evaluation_rewards",
          "objective_bonus_point_rewards"]
labels = "reward.condition_text"

[kind.notes]
labyrinth_id = "The world area whose stage list has it."
boss_flag = "A boss stage's name is set between ◆ marks."
event_entry_flag = "Choosing it plays an event instead of a battle map."
prerequisite_labyrinth_id = "With the prerequisite floor, the stage that must be cleared first."
required_party_unit_ids = "Units that must be in the sortie: the first five before its first clear, the other five once it is cleared or on a boss stage."
objective_rewards = "What each goal of the stage gives, by the goal as the game words it."

[kind.labels]
labyrinth_id = "Labyrinth"
floor_number = "Floor"
prerequisite_floor_number = "Prerequisite floor"
boss_flag = "Boss stage"
event_entry_flag = "Event stage"

[kind.referenced_as]
labyrinth_id = { heading = "Stages", details = ["floor_number"] }
prerequisite_labyrinth_id = { heading = "Stages that need one here cleared", details = ["prerequisite_floor_number"] }
objective_item_rewards = { heading = "Stage reward", details = ["labyrinth_id", "floor_number"] }
required_party_unit_ids = { heading = "Must join the sortie on", details = ["labyrinth_id", "floor_number"] }
"enemy.unit_id" = { heading = "Enemy on stages", details = ["labyrinth_id", "floor_number", "enemy.min_level",
                    "enemy.max_level"], parts = { ally = "Ally on stages" } }

# The dig tables are not published (the user, 2026-11-22): a table is reached only through a floor's dig points, the
# map objects of a stage, which no loader publishes yet, so its page could not say where it is dug. They go with the
# stage maps (docs/backlog.md).

# The world areas (the user, 2026-11-22): the places of the world map, which a stage's labyrinth and a unit's habitat
# name. Their map position is modder data.
[[kind]]
id = "world_area"
table = "world_area"
about = "The places on the world map, labyrinths, towns and facilities, and the days entering each takes."
exists = "name"
title = "name"
fields = ["area_type", "travel_days"]
filters = ["area_type"]
pictures = { picture = "picture_asset_id" }

[kind.notes]
area_type = "A labyrinth lists the stages to enter."
travel_days = "The days that pass in travelling there; once 30 days have passed, the party must return home."

[[kind]]
id = "character_profile"
table = "character_profile"
about = "The character profiles of the game's information menu: each one's epithet, race and sex, portrait and biography."
exists = "name"
title = "name"
text = ["epithet", "race_text", "sex_text"]
fields = ["unit_id"]
qualifiers = ["epithet"]
referenced_as = { unit_id = "Character profile" }
# The portrait is the standing art the profile screen shows (CS…AAA); the user chose to publish it (plan §4.1).
pictures = { portrait = "portrait_asset_id" }

[[kind.description]]
name = "biography"
script = { field = "biography_script_id" }      # CIMES, as INFO7 calls it
seed = { character_profile_selected_id = "key" }

[[kind]]
id = "objective"
table = "objective"
about = "The chapter objectives the game shows, each with its message."
exists = "text"
title = "text"
text = ["chapter_label"]
qualifiers = ["chapter_label"]

[[kind.description]]
name = "message"
script = { field = "message_script_id" }        # FAMES, as INFO1 calls it
seed = { current_objective_id = "key" }

[[kind]]
id = "glossary_entry"
table = "glossary_entry"
about = "The glossary of the game's information menu, each entry with its explanation."
exists = "name"
title = "name"

[[kind.description]]
name = "explanation"
script = { field = "message_script_id" }        # VIMES, as INFO8 calls it
seed = { current_vocabulary_id = "key" }

# The stage loaders (export plan §4.2): FIELD runs a stage's loaders (STINIT and its layers' $n$STINIT) just before
# kamidori.stage.after_loader. party_on_field 1 skips the arrival block, whose scenes can leave FIELD first
# (FIELD@0x1ef to 0x304); the 38 event-entry stages have no map.
[[loader]]
scope = "stage"
keys = "stage"
skip = { event_entry_flag = 1 }
script = "FIELD"
seed = { current_stage_id = "key", field_map_continue_mode = 0, party_on_field = 1 }
read_at = "kamidori.stage.after_loader"

[loader.tables.enemy]
exists = "unit_id"
fields = ["unit_id", "min_level", "max_level", "difficulty_mask", "first_visit_only"]
labels = { unit_id = "Unit", difficulty_mask = "Difficulty" }
notes = { difficulty_mask = "The difficulties the slot is placed on at a floor's start; with none, it is not placed then." }

# The slots on the player's side (the user, 2026-11-22: allies get their own table). A faction other than the
# player's is hostile when stage_faction_alliance[faction] is 0 or differs from slot 1's, the player's group
# (FIELD@0xab69, COMMITBTL, CALCSUPPORT; the registry's stage_faction_alliance), so a slot whose faction's group is not 0
# and is the player's is not; FIELD@0xc45 makes the same test when it places a slot. Only the stage loaders write the
# alliance: 14 of STINIT's stages give faction 3 the player's group (2026-11-22).
[[loader.tables.enemy.parts]]
name = "ally"
field = "faction_id"
global = "stage_faction_alliance"
same_as = 1
note = "Units whose faction the stage puts in the player's alliance, so they are not the player's enemies."

# The goals the stage's rewards are for, which label the stage's objective_rewards rows. STINIT leaves the first
# goal's text empty: AIM@0x5b4 and STAGECLEAR@0x8be draw a fixed text in its place, which a literal gives.
[loader.tables.reward]
exists = "condition_text"
text = ["condition_text"]
literals = [{ record = 0, field = "condition_text", script = "AIM", offset = 0x5b4 }]

# The title changes (the user, 2026-11-22): CCINIT's rules (and each append's), as CALCCC adds them up. A run for each
# rule column of a character: every other column marked applied, this one marked event-unlocked and not applied, the
# character at level 99, so that only that column's rule can fire, whether a level or an event gives it (no rule has
# both, and no two share a character and column, 2026-11-22). What it gives is read before CALCCC applies it. A
# variant unit (unit_canonical_character_id) has no rules of its own, so no rows. No scope: no data file edits what a
# class change gives (the registry's class_change table).
[[loader]]
keys = "unit"
key_range = [1, 99]
steps = 20
script = "CALCCC"
seed = [
    { global = "current_character_id", value = "key" },
    { global = "character_levels", index = ["key"], value = 99 },
    { global = "character_class_change_state", index = ["key", "*"], value = 1 },
    { global = "character_class_change_state", index = ["key", "step"], value = 2 },
]
read_at = "kamidori.class_change.rules_run"
# CALCCC zeroes the block before the rules add to it, so a delta no rule touches is CALCCC's zero.
builders = ["CALCCC"]

[loader.tables.title_change]
table = "class_change"
exists = "title_level"
text = ["title"]
fields = ["title_level", "party_cost_delta", "party_capacity_delta", "stat_deltas", "stat_cap_deltas",
          "resistance_deltas", "skill_slot_replacements"]
notes = { title_level = "The level the title comes at." }

# The script relations (spec §6.7, export plan §4.5): where a scene sets a script's arguments to constants and calls it.
# ADDITEM gives or takes an item by the sign of its count (docs/kamidori-data-tables.md, Giving and taking).
[[script_relation]]
id = "given_in"
negative = "taken_in"
call = "ADDITEM"
kind = "item"
key = "current_item_id"
count = "current_item_count_change"
exclude = ["DEBUG*"]

# UNITECH joins the units of its lists (Joining the party). Every caller joins one unit, entry 0, which `where` checks.
[[script_relation]]
id = "joins_in"
call = "UNITECH"
kind = "unit"
key = "joining_unit_ids"
where = { joining_unit_count = 1 }
exclude = ["DEBUG*"]
