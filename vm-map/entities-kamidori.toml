# Kamidori's entity declarations: what the project site publishes of the game's data (game data export spec §5).
# Hand-edited; tools/entities_build.py checks it against vm-map/globals-kamidori.toml (its tables, their
# [table.refs], its globals), vm-map/patch-points-kamidori.toml and the profile's saved prefix, and writes
# build/games/kamidori/entities.json for the exporter.
#
# Scripts are named without the `$n$` prefix of an update or append and without `.BIN`. Fields are named as the record
# map names them, a column by its name after a dot. A field left out of a kind is still in the modder data.
#
# The story flags and scene numbers that gate a record (a quest's appear flags, a recipe's unlock flags, a glossary
# entry's scenes) are left out: their numbers mean nothing to a reader, so they are modder data only (the user,
# 2026-11-22). A group shows published rows of cells of one width as one table, a row for each element.
#
# A note explains a detail to a reader in a line (the user, 2026-11-22): it says only what the registry's value domain
# and usage establish for the field's global, in plain words, and only where the label and value leave a reader
# guessing. What a value means is the registry's (its globals' value facets: words, the game's names, scale, offset and
# unit), not a note's; a label names a field whose own name reads as the game stores it.
#
# A field is published when it means something to a player (the usability review, 2026-11-22): sort keys, catalog
# switches, variant and group ids, routines, spawn places and weights are the game's machinery, left to the modder data.
#
# Qualifiers tell apart the entities of a kind that share a name (the review's finding 7): a unit's versions by class
# title, then level range; a stage by labyrinth and floor; an objective by chapter. The site adds only those that
# differ within the group, and the id where none does (22 pairs of townsfolk units differ in nothing published).
# `referenced_as` says how a reference reads on its target's page (finding 8): the heading of the list of entities
# whose field names it, and the fields shown beside each (a drop's chance, a stage's labyrinth and floor).

[export]
# The tables as the game plays with them: INIT2's exit, after every layer (spec §14, answer 2).
boot = { script = "INIT2", read_at = "kamidori.boot.data_ready" }
# The scripts whose stored values may be published: INIT2 itself (it stores table literals), the *INIT and *INIT2
# table scripts and their `$n$` updates, and AUTORUN, which the appends run.
builders = ["INIT2", "*INIT", "*INIT2", "AUTORUN"]
# Never builders, whatever matches them: the CG gallery, the H-scene replays and the event-CG substitution.
excluded_builders = ["CGINIT", "SPINIT", "EVINIT"]
# The information screens whose shown text is data (spec §5.7, §14 answer 6): item and skill descriptions, the
# glossary, character profiles, chapter objectives.
text_scripts = ["ITMES", "SKMES", "VIMES", "CIMES", "FAMES"]
# The pictures the site shows blurred until a click (the user, 2026-11-21): nudity, by catalog name. Found by looking
# at every picture the declarations publish: the eleven clothing-damaged battle pictures (`CB…AAB`) and three of the
# base battle art. Suggestive but covered art (CB551AAA, CB311AAA, CB016AAA) is not on the list.
explicit_pictures = ["CB*AAB", "CB052AAA", "CB504AAA", "CB505AAA"]

[[kind]]
id = "item"
table = "item"
about = "Every item: its category, rank and price, the stats, resistances and conditions it changes, the skill it grants, and its use as furniture or in the garden."
exists = "name"
title = "name"
text = ["short_description"]
fields = [
    "category", "rank", "price", "attack_element", "min_range", "max_range", "stat_modifiers",
    "critical_rate_bonus", "affinity_level_deltas", "condition_level_deltas", "equipped_condition_levels",
    "granted_skill_id", "resource_recovery_amounts", "cursed_flag", "sex_restriction_mask", "character_whitelist",
    "growth_enabled", "garden_product_item_id", "garden_production_period",
    "furniture_area", "furniture_width", "furniture_height",
    "furniture_sales_count_bonus", "furniture_purchase_desire_bonus", "furniture_visit_rate_bonus",
    "furniture_high_price_bonus", "furniture_equipment_bonus", "furniture_information_bonus",
    "furniture_mutation_bonus", "furniture_knowledge_bonus", "furniture_staff_count_bonus", "furniture_garden_bonus",
]
filters = ["category", "rank", "attack_element"]
qualifiers = ["category"]
pictures = { icon = "icon_asset_id", furniture = "furniture_sprite_asset_id" }

[kind.notes]
price = "Buy is what a shop charges for it, sell what a vendor pays for it, and retail the base price it sells for in the player's own shop."
affinity_level_deltas = "How it changes each element's resistance while equipped. The game names a change by the grade that many steps past the middle one, as it names a unit's resistance."
condition_level_deltas = "The level it changes each condition by: -5 clears the condition, and a positive number inflicts it or raises it."
equipped_condition_levels = "The level of each condition its wearer has while it is equipped."
resource_recovery_amounts = "The HP, SP and FS it restores; 999 restores them in full."
cursed_flag = "A cursed item cannot be unequipped."
character_whitelist = "The characters allowed to equip or use it, up to five."
growth_enabled = "The item gains growth experience as it is used."
furniture_area = "The room it goes in."
sex_restriction_mask = "Only characters of these sexes may use it."

[kind.labels]
affinity_level_deltas = "Element resistance"
cursed_flag = "Cursed"
growth_enabled = "Grows with use"
sex_restriction_mask = "Usable by"
character_whitelist = "Characters"

[kind.referenced_as]
granted_skill_id = "Granted by items"
character_whitelist = "Restricted items it may use"
garden_product_item_id = { heading = "Produced in the garden by", details = ["garden_production_period"] }

[[kind.description]]
name = "description"
script = { field = "handler_script_id" }        # ITMES or a `$n$ITMES`, as SHOP calls it
seed = { current_item_id = "key" }

[[kind]]
id = "unit"
table = "unit"
about = "Every character and monster: stats and growth, element resistances, starting equipment and skills, what it drops, and the areas it lives in."
exists = "full_name"
title = "full_name"
text = ["display_name", "initial_class_title", "bestiary_description"]
fields = [
    "race", "sex", "bestiary_listed", "starting_level", "level_cap", "stats",
    "stat_growth", "initial_stat_caps", "element_resistance", "equippable_category_mask", "initial_weapon_level",
    "default_attack_item_id", "initial_equipment", "default_costume_item_id", "skill", "party_cost",
    "initial_affinity_tenths", "experience_reward", "bestiary_knowledge_gain", "drop_item", "drop_chance",
    "habitat_area",
]
filters = ["race", "sex"]
qualifiers = ["initial_class_title", "starting_level", "level_cap"]

[[kind.group]]
name = "stat_table"
fields = ["stats", "stat_growth", "initial_stat_caps"]

[[kind.group]]
name = "drops"
fields = ["drop_item", "drop_chance"]

[kind.notes]
stat_table = "Stats are its base values at its starting level, growth what it gains each level, and the caps a playable character's own ceilings (0 uses the game's common cap)."
element_resistance = "Each element's resistance, as the game names its steps."
equippable_category_mask = "The kinds of item it can equip."
drops = "Each item it can drop and its chance; a chance of 5% or less counts as a rare drop."
habitat_area = "The world areas the bestiary lists as where it lives."

[kind.labels]
bestiary_listed = "In the bestiary"
initial_affinity_tenths = "Initial affinity"
equippable_category_mask = "Equips"

[kind.referenced_as]
skill = "Units that have it"
drop_item = { heading = "Dropped by", details = ["drop_chance"] }
default_attack_item_id = "Default attack of"
default_costume_item_id = "Default costume of"
initial_equipment = "Initial equipment of"
habitat_area = "Units that live here"
"title_change.skill_slot_replacements" = { heading = "Gained with a title", details = ["title_change.title"] }

# The user's choice (spec §5.4): the face, the bestiary sprite and the battle sprites. The registry names the columns
# from file prefixes. Milestone 1 looked at each column's pictures (2026-11-21): face is the party list's face plate
# with the name (47 units); sprite the map's four-frame walking sheet; battle_1 the battle art (AAA); battle_2 and
# battle_3 are AAA too, except for 28 units whose AAB variant is the clothing-damaged art, which is explicit (see
# [export] explicit_pictures); battle_face a close-up face (AB).
[kind.pictures]
face = "graphic.face_CA_AA"
sprite = "graphic.map_sprite_compact_CP_AA"
battle_1 = "graphic.battle_sprite_1_CB_AAA"
battle_2 = "graphic.battle_sprite_2_CB_AAA_or_AAB"
battle_3 = "graphic.battle_sprite_3_CB_AAA_or_AAB"
battle_face = "graphic.battle_sprite_CB_AB"

[[kind]]
id = "skill"
table = "skill"
about = "Every skill: its category and equip cost, its range and element, the conditions it inflicts, and the stats and resources it changes."
exists = "name"
title = "name"
text = ["short_description"]
fields = [
    "category", "equip_cost", "bundled_skill_ids", "min_range_encoded", "max_range_encoded",
