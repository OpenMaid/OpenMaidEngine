# Arterial's entity declarations: what the project site publishes of the game's data (game data export spec §5).
# Hand-edited; tools/entities_build.py checks it against vm-map/globals-arterial.toml (its tables, their
# [table.refs], its globals), vm-map/patch-points-arterial.toml and the profile's saved prefix, and writes
# build/games/arterial/entities.json for the exporter. The tables are described in docs/arterial-data-tables.md.
#
# The conventions are Kamidori's (vm-map/entities-kamidori.toml): scripts named without the `$n$` prefix and `.BIN`;
# the scenes that gate a record left to the modder data; a field published when it means something to a player; and a
# note only where the label and value leave a reader guessing.
#
# A card is a row and a slot (row × 30 + slot), and every table that names one names it by two fields: the registry's
# [table.refs] joins them ({ table = "card", times = 30, plus = "…_slot" }), so a recipe, a deck or a reward links to
# its card.

[export]
# The tables as the game plays with them: INIT2's exit, after every layer (docs/arterial-data-tables.md, "How the
# data gets into memory").
boot = { script = "INIT2", read_at = "arterial.boot.data_ready" }
builders = ["INIT2", "*INIT", "AUTORUN"]
# Never builders, whatever matches them: the CG gallery and the H-scene replays.
excluded_builders = ["CGINIT", "SPINIT"]
# INIT2 runs COUNTSKILL, which counts the skills of the party (none, at the boot) into party_skill_counts: play state,
# withheld without a refusal.
derived = ["COUNTSKILL"]
# The information screens whose shown text is data: the glossary, the character profiles and the tips.
text_scripts = ["VIMES", "CIMES", "TIMES"]
# The pictures the site shows blurred until a click: nudity, by catalog name. Found by looking at every picture the
# declarations publish (2026-11-22): only card art, none of the other kinds'. The bath cards (CD0..VA), the 精気吸収
# cards and the nude monsters and angels, each with the twin that shares its art in the other frame. Suggestive but
# covered art (CD127AA, CD127CA, CD127KA, CD088AA, the glossary's VI013) is not on the list.
explicit_pictures = [
    "CD002VA", "CD003VA", "CD004VA", "CD005VA", "CD006VA", "CD007VA", "CD008VA", "CD009VA", "CD041VA",
    "CD002KA", "CD003JA", "CD004JA", "CD005KA", "CD006BA", "CD006NA", "CD007KA", "CD008KA", "CD009JA", "CD041KA",
    "CD041ZA", "CD041LA", "CD054CA", "CD054DA", "CD095EA", "CD095FA",
    "CD052PA", "CD052QA", "CD053AA", "CD053BA", "CD090RA", "CD090SA", "CD092IA", "CD092JA", "CD092KA",
    "CD092QA", "CD092RA", "CD121JA", "CD121KA", "CD121LA", "CD121NA",
    "CD123CA", "CD123DA", "CD123EA", "CD123FA", "CD123IA", "CD123JA", "CD123KA", "CD123LA", "CD123PA", "CD123QA",
    "CD124NA", "CD124OA", "CD124PA", "CD124QA", "CD124RA", "CD124SA", "CD127IA", "CD127JA",
    "CD151EA", "CD151FA", "CD151GA", "CD151HA", "CD151IA", "CD151JA", "CD151NA", "CD151OA", "CD151RA", "CD151SA",
    "CD152GA", "CD152HA", "CD167AA", "CD167BA",
]

[[kind]]
id = "card"
table = "card"
about = "Every card: its rarity, races and numbers at level 1, the talents it carries, its price, and its flavour text."
exists = "name"
title = "name"
text = ["flavor"]
fields = ["rarity", "race_flags", "cost", "control", "slots", "attack", "hp", "leader_lp", "talent_id", "price"]
filters = ["rarity", "category", "race_flags", "cost", "control"]
# A card is named for its character, so one name has many cards: its rarity, cost and attack tell them apart.
qualifiers = ["rarity", "cost", "attack"]
pictures = { art = "picture.0" }
# The card book's tabs (INFOCD@0xa16 to 0xa99): tab 0 lists the cards with ＬＰ, tabs 1 to 7 the cards with none whose
# race is the tab's (race bit tab − 1), and tab 8 every card with a race. So a leader is in its tab alone, though it
# has races too, and a card of several races is in each of their tabs.
categories = { category = [{ field = "leader_lp", word = "Leader" }, { field = "race_flags" }] }

[kind.labels]
race_flags = "Races"
control = "Control"
leader_lp = "Leader LP"
talent_id = "Talents"

[kind.notes]
category = "The card book's tab: a leader's, or that of each race the card has."
leader_lp = "A leader card has LP in the place of HP."
slots = "How many items the card can carry; it grows with the card's level, to 3."
price = "Buy is what a shop charges for it, sell what the game pays for each copy over 99."

[kind.referenced_as]
talent_id = "Cards with it"

[[kind]]
id = "talent"
table = "talent"
about = "The abilities a card carries: when each acts, and what it does."
exists = "name"
title = "name"
text = ["description"]
fields = ["timing"]
filters = ["timing"]

[kind.notes]
timing = "When the talent acts: the word its description opens with."

[[kind]]
id = "skill"
table = "skill"
about = "The party's skills: where each works, and the number its text gives."
exists = "name"
title = "name"
text = ["text"]
fields = ["kind", "amount"]
filters = ["kind"]

[kind.labels]
kind = "Works"

[[kind]]
id = "item"
table = "item"
about = "Every item: its kind and rarity, what a card must have to carry it and what it adds, and its price."
exists = "name"
title = "name"
text = ["text"]
fields = [
    "kind", "rarity", "price", "card_row",
    "required_slots", "required_races", "excluded_races", "required_cost", "required_control", "required_attack",
    "required_hp", "required_leader_lp",
    "cost_bonus", "control_bonus", "attack_bonus", "hp_bonus", "leader_lp_bonus", "talent_id", "condition_id",
]
filters = ["kind", "rarity"]
qualifiers = ["kind"]
pictures = { icon = "picture.1" }

[kind.labels]
talent_id = "Talent"
condition_id = "Condition"
card_row = "Carried only by"
required_races = "Races required"
excluded_races = "Races barred"
leader_lp_bonus = "Leader LP bonus"
required_leader_lp = "Least leader LP"
required_slots = "Least slots"
required_cost = "Least cost"
required_control = "Least control"
required_attack = "Least attack"
required_hp = "Least HP"

[kind.notes]
kind = "A card carries an equipment (装備) item; a consumable (消費) one is used in battle."
talent_id = "The talent the item gives the card that carries it."
condition_id = "The condition the consumable item gives its target in battle."
required_races = "The card must be of one of these races."
card_row = "The cards that may carry it, every card of one row or one card of it (INIT2 takes it off any other)."

[kind.referenced_as]
talent_id = "Items that give it"
condition_id = "Items that inflict it"
card_row = "Items only some cards may carry"

[[kind]]
id = "condition"
table = "condition"
about = "The conditions a card can be under in battle, and what each does to its numbers."
exists = "name"
title = "name"
fields = ["kind", "attack_change", "hp_change", "turn_hp_change"]
filters = ["kind"]

[kind.labels]
turn_hp_change = "HP each turn"

[[kind]]
id = "ultimate"
table = "ultimate"
about = "The 奥義, a character's special move: how fast its gauge fills and its number at each of its nine levels."
exists = "name"
title = "name"
text = ["level_lines"]
fields = ["gauge_gain", "amount"]
pictures = { art = "picture.1" }

[[kind.group]]
name = "levels"
fields = ["gauge_gain", "amount"]

[kind.labels]
gauge_gain = "Gauge each turn"
level_lines = "Text by level"

[kind.notes]
levels = "Row n is level n: how much the gauge fills each turn, and the number the level's text gives."

[kind.text_blocks.level_lines]
level_1 = [3, 5]
level_2 = [6, 8]
level_3 = [9, 11]
level_4 = [12, 14]
level_5 = [15, 17]
level_6 = [18, 20]
level_7 = [21, 23]
level_8 = [24, 26]
level_9 = [27, 29]

[[kind]]
id = "character"
table = "character"
about = "Everyone who speaks a line: the name plate's names, and a party character's 奥義 and pictures."
exists = "name.name"
title = "name.name"
# A party character's record of party_member is its character id (the registry's records_of): what it brings at each
# of its levels. Its level item column is in the scripts, and no record writes it.
joins = ["party_member"]
fields = ["ultimate_id", "party_member.level_card_row", "party_member.level_skills",
          "party_member.level_ultimate_level"]
pictures = { portrait = "picture.0" }

# Row r is level r: the card it brings then, its four skills (one for each skill line) and the 奥義 level it reaches.
[[kind.group]]
name = "levels"
fields = ["party_member.level_card_row", "party_member.level_skills", "party_member.level_ultimate_level"]
row_label = "Level"

[kind.labels]
ultimate_id = "奥義"
levels = "Levels"
"party_member.level_card_row" = "Card"
"party_member.level_skills" = "Skill line"
"party_member.level_ultimate_level" = "奥義 level"

[kind.notes]
levels = "What the character brings as it reaches each level, once: a copy of a card, a skill for each of its four skill lines while the line is open, and the 奥義 level it reaches."

[kind.referenced_as]
ultimate_id = "Characters with it"
"party_member.level_card_row" = "Brought by characters"
"party_member.level_skills" = "Characters with it"

