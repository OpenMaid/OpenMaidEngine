# ---------------------------------------------------------------- tables

[[table]]
name = "character"
records = 1000
built_by = "boot"
usage = "CHINIT characters keyed by character id (1 to ~300 the story and the party, 301 and up enemies; $1$CHINIT adds 901..916, $2$CHINIT 230..962), with CVINIT's voice setting by character. Nothing of it is saved. At a character's first join UNITECH copies the base level, the item kind ranks, the equipment and the items into the saved state, so a later patch of those reaches only characters not yet joined; the stats, skills, sizes, types and morale cap are read again every time SETCH and CALCLVUP build the unit."

