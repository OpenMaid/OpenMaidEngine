# ==== Scenes and screens (docs/ladea-data-tables.md). Saved prefix G < 0xcf2e6, GS < 0x34f. Offsets are dword
# ==== offsets in the disassembly. The mode loop's cells (G[0x0]..G[0x3]) are SYSTEM4's.

# ---- The mode loop (SYSTEM4) ----

[[global]]
address = "0x0"
name = "system_mode"
category = "index-pointer"
type = "int"
values = { 1 = "Scene", 2 = "Town", 3 = "Dungeon", 4 = "Battle", 5 = "Deal" }
usage = "SYSTEM4's mode loop (SYSTEM4@0x2de..0x6be): 1 a scene pass, 2 TOWN (@0x673), 3 FIELD, the dungeon (@0x687), 4 BTL (@0x69b), 5 DEAL (@0x6af); any other value shows 不正な実行モード and asks to exit (@0x6b5). A screen hands the turn to a scene by setting 1: SCJUMP's rules, the map events (MPEV011@0x815), TOWN@0x1423, BTL@0x50f, GAMESTART@0x139e. TOWN@0x13b0 sets 5. Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x1"
name = "system_next_mode"
category = "index-pointer"
type = "int"
usage = "The mode to take after the scene: SYSTEM4@0x656..0x65d copies it into system_mode when it is nonzero, after SETFATE has run (@0x653). The map events set 3 (MPEV011@0x81a), TOWN 2 for a visit (TOWN@0x144e), BTL 4 for a battle's result scene (BTL@0x536); the others clear it. Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x2"
name = "system_base_mode"
category = "index-pointer"
type = "int"
usage = "The last mode other than a scene: a caller copies system_mode into it, when that is not 1, before it hands a scene over (TOWN@0x13ab, @0x141e; BTL@0x50a; GAMESTART@0x1399; the map events, MPEV014@0x15e); FIELD@0x36b sets 3 and BTL@0x56d 4. No script reads it. Saved."
source = "investigation"
confidence = "med"

[[global]]
address = "0x3"
name = "system_after_battle_mode"
category = "index-pointer"
type = "int"
usage = "The mode a battle returns to: BTL@0x54a..0x568 sets system_mode to it when it is nonzero, else to 3 (FIELD) when G[0x4dd6f] is set and to 2 (TOWN) otherwise, then clears it (@0x577). The map events and FIELD set 3 when they start a battle (MPEV014@0x16d, FIELD@0x3d32); the scene handovers clear it. Saved."
source = "investigation"
confidence = "med"

