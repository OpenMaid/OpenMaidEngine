enemy_actions = "character_enemy_actions"
innate_skill_ranks = "character_innate_skill_ranks"
initial_item_kinds = "character_initial_item_kinds"
initial_item_kind_ranks = "character_initial_item_kind_ranks"
initial_weapon = "character_initial_weapons"
initial_shield = "character_initial_shields"
initial_armor = "character_initial_armors"
