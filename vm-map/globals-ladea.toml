# ==== Skills, conditions and battle: SSINIT, AFINIT, ILINIT, COINIT, RTINIT, BTANINIT2, BTANINIT (docs/ladea-data-tables.md) ====
# Every array here lies above the saved prefix (G < 0xcf2e6, GS < 0x34f), so none of it is saved; the saved
# character cells the battle reads are cited by address.
# Names reuse bg0's and Verita's where the field is the same (condition_*, routine_step_*, battle_animation_*,
# battle_effect_*, element_affinities, formation_*).

# ---- SSINIT: special skills (boot, leader G[0x2fcc97], 500 families x 5 levels) ----

[[global]]
address = "0x2fc8af"
name = "special_skill_append_numbers"
category = "data-table"
type = "int[500]"
usage = "SSINIT: the layer that adds the family, 1 on the seven families $1$SSINIT adds (131..133, 216..219; $1$SSINIT@0x0 writes it ahead of the family's leader). No script reads it."
source = "investigation"
confidence = "med"

[[global]]
address = "0x2fcaa3"
name = "special_skill_sort_keys"
category = "data-table"
type = "int[500]"
usage = "SSINIT: the family's sort key, 10..1940; sort-indices-by-key-sum at CHECKSS@0x2f3 and COMMITSS@0x86."
source = "investigation"
confidence = "high"

[[global]]
address = "0x2fcc97"
name = "special_skill_kinds"
category = "data-table"
type = "int[500]"
values = { "1" = "attack", "2" = "defense", "3" = "start", "4" = "always", "5" = "special" }
usage = "SSINIT: when the family acts, as its description's first word says: 1 【攻撃】, 2 【防御】, 3 【開始】, 4 【常時】, 5 【特殊】. CHECKSS (@0xb1, @0x110, @0x337, @0x472) and COMMITSS (@0xf4, @0x23f) test it; SETCH@0x8e6 adds a kind-4 level's conditions; CHECKSS4@0x65 zeroes the attacker's kind-1 families. The table's leader."
source = "investigation"
confidence = "high"

[[global]]
address = "0x2fd65b"
name = "special_skill_attack_only_flags"
category = "data-table"
type = "int[500]"
usage = "SSINIT: 1 when the family acts only on an attack, an action whose ITINIT G[0x34f897] is 1 or 2 (CHECKSS@0x161)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x2fd84f"
name = "special_skill_hp_costs"
category = "data-table"
type = "int[500][5]"
usage = "SSINIT: the HP cost of each level; no record writes it. CHECKSS@0x37e..0x45b keeps a level only while HP plus it stays at least 1, COMMITSS@0x122..0x17b applies it."
source = "investigation"
confidence = "med"

[[global]]
address = "0x2fe213"
name = "special_skill_mp_costs"
category = "data-table"
type = "int[500][5]"
usage = "SSINIT: the MP cost of each level, negative (3 families); CHECKSS keeps a level only while MP plus it stays at least 0, COMMITSS@0x122..0x17b applies it."
source = "investigation"
confidence = "high"

[[global]]
address = "0x2febd7"
name = "special_skill_tp_costs"
category = "data-table"
type = "int[500][5]"
usage = "SSINIT: the TP cost of each level, negative (貫通Ⅰ -3; 9 families); checked and taken like the MP cost (CHECKSS@0x4a8..0x5a9, COMMITSS@0x122..0x17b)."
