# vm-map/globals-ladea.toml -- CANONICAL living global-variable registry for 天秤のLa DEA。
# (ladea, SYS4445; hand-edited). Global addresses are per game, so this is separate from the
# other games' registries; the schema is identical (the type implies the bank: `string...` entries are
# string-bank cells, everything else integer cells).
# Generated artifacts (build/games/ladea/globals.json, docs/global-reference-ladea.md) come from
# this file via `tools/globals_build.py --game ladea --build`. Do not edit those.
# Layouts and evidence: docs/ladea-data-tables.md. Only what is understood has a name here.
[meta]
note = "Curated ladea global addresses. Names started 2026-11-26 from the table layouts of tools/init_layout.py and their consumers (docs/ladea-data-tables.md)."


# ==== The boot: options, SYSTEM4's and INIT2's constants, the hook chains ====

