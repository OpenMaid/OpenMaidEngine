usage = "SSINIT: the amount of each level, each family's own: 貫通 lowers the defender's defence and defence count by it (SETSSBONUS@0x24, @0x68), 抉り切り上げ adds it to damage and critical hits (SETSSBONUS@0xac); SETSSDAMAGE, BTLMAIN and CALCDAMAGE read it too."
