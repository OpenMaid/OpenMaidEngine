category = "data-table"
type = "int[8]"
usage = "The y of the eight steps to a cell's neighbours, 0, -1, 0, 1, -1, -1, 1, 1 (INIT2@0x1dc), beside neighbour_dx (SETROUTE@0x68d). Rebuilt at boot."
source = "investigation"
confidence = "high"

[[global]]
address = "0xa6b7f8"
name = "installed_appends_mask"
category = "data-table"
type = "int"
usage = "A bit per mounted append: $1$AUTORUN sets bit 1 (bit-set 0x1, $1$AUTORUN@0xc6). GAMESTART compares it with the shared profile's copy for the 32 appends (GAMESTART@0x21..0x84); an autosave and SAVE copy it into the slot's G[0xb82 + slot] and store that (ALLMAP@0x2e1a..0x2e2d, SAVE@0xc06..0xc19), and SAVE tests a slot's copy against it (SAVE@0x1853). Above the saved prefix: set again on every boot and load."
source = "investigation"
confidence = "high"


