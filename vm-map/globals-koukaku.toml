# koukaku M2 group 6: scenes and screens. Saved prefix G < 0x211c08, GS < 0x1b1.
# Offsets are dword offsets in the disassembly. Cells of other groups are cited by address only.

# ---- The mode loop (SYSTEM4) ----

[[global]]
address = "0x0"
name = "system_mode"
category = "index-pointer"
type = "int"
usage = "SYSTEM4's mode loop (SYSTEM4@0x302..0x746): 1 a scene pass, 2 ALLMAP, 3 FIELD, 4 REIGN, 5 DEAL; any other value shows 不正な実行モード and asks to exit. A screen hands the turn to a scene by setting 1 (ALLMAP@0x6fa.., PALACE@0x801, SCJUMP's rules). Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x1"
name = "system_next_mode"
category = "index-pointer"
type = "int"
usage = "The mode to return to after the scene: SYSTEM4@0x65c..0x663 copies it into system_mode when it is nonzero, then reruns the dispatch in the same context unless scjump_context_id is 2 or 7. ALLMAP sets 2 (ALLMAP@0x704), REIGN 4 (REIGN@0xb05, @0x1d9a), PALACE 5 (PALACE@0x7f7), BROTHEL 4 (BROTHEL@0xfe0); CONQUEST clears it before a battle (CONQUEST@0x4c5). Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x2"
name = "system_base_mode"
category = "index-pointer"
type = "int"
usage = "The last mode other than a scene: SYSTEM4@0x68e..0x69c copies system_mode into it when that is not 1; the screens set it before a scene (REIGN@0xb00 4, PALACE@0x7f2 5, CONQUEST@0x4bb). INIT2@0x3a2..0x3eb reads it on a load inside a scene over the map, to rebuild the screen under it: READMAP for 2; READFIELD, READREIGN and READCH for 4. Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0xc5a"
name = "current_scene_script_id"
category = "index-pointer"
type = "int"
usage = "The script of the scene pass: SYSTEM4@0x317..0x33f sets it to scene_script_ids[current_scene_id], or SC0000 (0x56) where that is 0, unless scene_run_mode is set (TITLE's debug entries set it themselves); SYSTEM4@0x4f0 calls it. Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0xc5e"
name = "scene_window_layout"
category = "index-pointer"
type = "int"
usage = "The message window's layout for the scene pass: SYSTEM4@0x47a..0x4a3 sets 2 for a scene over the map (scene_over_map), 1 in the replay room (replay_room_active), 0 otherwise; SYSTEM4's label_74b (@0x74b..0x7ac) sets the two text origins for each. The scene scripts' own header sets it the same way ($1$SC4000@0xa83..0xaa0, DEBUGADV@0xa83). Saved."
source = "investigation"
confidence = "high"

# ---- Scenes ----

[[global]]
address = "0x213ef3"
name = "current_scene_id"
category = "choice-output"
type = "int"
usage = "The scene to play: SCJUMP's rules set it with system_mode 1 (SCJUMP@0x1be..); the visit screens set it from a visit slot (ALLMAP@0x6fa, REIGN@0xafb and @0x1d90, PALACE@0x7ed); BROTHEL@0xfdb from a HAINIT array; GAMESTART@0x16d8 sets 0, the prologue. SYSTEM4@0x325 looks it up in scene_script_ids, and each scene script branches on it (SC0000@0xc66..0xceb). Not saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x213ef5"
name = "scjump_chain_pending"
category = "choice-output"
type = "int"
usage = "The dispatch's open turn: a caller sets 0x7fffffff before it walks the SCJUMP chain (ALLMAP@0x57.., SYSTEM4@0x668), and the first rule whose condition holds clears it as it sets current_scene_id, so no later rule in the chain takes the turn (SCJUMP's rules test `G[0x213ef5] > 0`). Not saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x37d4"
name = "scjump_context_id"
category = "index-pointer"
type = "int"
usage = "SCJUMP's context, 1 to 13 (SCJUMP@0x0..0xb6): 1 the turn's start (ALLMAP@0x27ee), 2 the visits on offer (ALLMAP@0x2f7e, PALACE@0x9b7, REIGN@0x2845), 3 and 4 the world map (ALLMAP@0x292a, @0x29c1 and others), 5 and 6 internal affairs (REIGN@0x2c18, @0x2c97), 7 a battle begins (ALLMAP@0xb81), 8 a sortie (FIELD@0xab6 and others), 9 a retreat (FIELD@0x9ad0), 10 a victory (FIELD@0xefe2), 11 (ALLMAP@0x2885), 12 and 13 the turn's end (ALLMAP@0xe6a, @0xf01). SCINIT's scene_offer_contexts give the same numbers. Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0xc71"
name = "scene_played_flags"
category = "story-flag"
type = "int[10000]"
usage = "Played scenes, by scene number: each scene's branch sets its cell to 1 as it starts (1150 branches, every one G[0xc71 + its number]; SC0000@0xcf2). SCJUMP's rules test them most (4401 tests of 864 cells): a scene is offered while its own is not 1 and once others are. Numbers SCINIT does not use are story flags too: G[0x2801] (SC0200@0x10949, tested by 630 rules), G[0x27ff] and G[0x2800] (SC0220@0x3ffb, @0x4451), G[0x2802] (READY@0x438). TUTORIAL@0x498 tests them. Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x38a6"
name = "scene_turns_since_played"
category = "counter"
type = "int[10000]"
usage = "Turns since a scene was played, by scene number: at each new turn ALLMAP@0x244c..0x248c adds 1 to the cell of every scene whose scene_played_flags cell is set, before it raises the turn counter G[0x170a4] (ALLMAP@0x248f). SCJUMP's rules test it 192 times, e.g. scene 206 needs G[0x3973] >= 2 (SCJUMP@0x1be). Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x38a5"
name = "scene_over_map"
category = "ui-toggle"
type = "int"
usage = "1 while the scene plays over the map, not in the ADV screen: the screens copy scene_on_map_flags[scene] into it as they hand a scene over (ALLMAP@0x6dd4 and others). SYSTEM4@0x47a picks the message window by it, and INIT2@0x3a2 rebuilds the map under such a scene on a load. Saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x1a1ba2"
name = "scene_seen_flags"
category = "data-table"
type = "int[10000]"
usage = "Scenes this player has seen, by scene number: set at the scene's end and stored in the shared profile, by SYSTEM4@0x5f1..0x658 and by each scene script (SC0000@0xbf3..0xc5a), unless scene_run_mode, replay_room_active or a debug switch is set. INFO2 unlocks tips and glossary entries by them (INFO2@0x19b, @0x503..), INFO22 and INFO23 a page's lines. Saved, and kept in the shared profile."
source = "investigation"
confidence = "high"

[[global]]
address = "0xa6bab9"
name = "scene_run_mode"
category = "index-pointer"
type = "int"
usage = "How a scene script runs: 0 normally (it branches on current_scene_id); 1 the debug scene jump, set by TITLE@0x49e, where the script loops on a label picked by coroutine-label-yield (SC0000@0x900..0xc5e); -1 for TITLE's DEBUGADV and DEBUGADV2 entries (TITLE@0x4c4, @0x4e2) and HMODE's replay setup (HMODE@0x7db). While it is set SYSTEM4 neither looks the scene up nor marks it seen. Not saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x211c1a"
name = "replay_room_active"
category = "ui-toggle"
type = "int"
usage = "1 while HMODE's replay room runs (HMODE@0x0 sets it, @0x113d clears it): a scene played from it marks nothing seen (SYSTEM4@0x5f1..) and uses the replay window layout (SYSTEM4@0x48c). Not saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0xa6baba"
name = "debug_map_active"
category = "ui-toggle"
type = "int"
usage = "1 once TITLE's debug menu has opened DEBUGMAP (DEBUGMAP@0x0); SYSTEM4@0x5f1.. marks no scene seen while it is set, and TUTORIAL shows nothing. Not saved."
source = "investigation"
confidence = "med"

[[global]]
address = "0xa6babb"
name = "debug_am_active"
category = "ui-toggle"
type = "int"
usage = "1 once TITLE's debug menu has opened DEBUGAM (DEBUGAM@0x0); SYSTEM4 then marks no scene seen and skips the SCJUMP chain after a scene (SYSTEM4@0x6a4..0x6ab), INFO2 skips its unlock pass (INFO2@0x1ec). Not saved."
source = "investigation"
confidence = "med"

# ---- SCINIT ----

[[global]]
address = "0x214263"
name = "scene_script_ids"
category = "data-table"
type = "int[10000]"
usage = "SCINIT: the script that plays each scene, a packed script id (SC0000 is 0x56; an append's scenes carry its selector in the top byte, $1$SC4000). 791 scenes, 0 to 6986, 13 of them from $1$SCINIT (4000 to 4015); one script holds ten numbers and branches on current_scene_id. SYSTEM4@0x325 reads it. Not saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x216973"
name = "scene_offer_contexts"
category = "data-table"
type = "int[10000]"
usage = "SCINIT: the SCJUMP context, 1 to 13, whose rules offer the scene, or -1 for one the chain never offers (the 娼婦の館 and other scenes). It matches the kind in each scene's ▼ comment (1 週切替開始ADVイベント, 2 訪問, 3 全体マップADVイベント, 8 出撃 …); 543 of 563 rules offer a scene in its context. No script reads it. Not saved."
source = "investigation"
confidence = "high"

[[global]]
address = "0x219083"
name = "scene_visit_ranks"
category = "data-table"
type = "int[10000]"
usage = "SCINIT's third array, not written by this game: the context-2 rules replace the scene in a visit slot only when the slot's scene has a greater value than the new one (SCJUMP@0x470a..0x471d), so a lower value would win; with every cell 0 a slot keeps the first scene put in it. Not saved."
source = "investigation"
confidence = "med"

[[global]]
address = "0x21b793"
name = "scene_on_map_flags"
category = "data-table"
type = "int[10000]"
usage = "SCINIT: 1 on the 239 scenes that play over the map (the ▼ comments' MAPイベント, マップ会話 and the battlefield's 出撃, 撤退 and 勝利 events), 0 on the ADV scenes. The screens copy it into scene_over_map as they hand a scene over (ALLMAP@0x6dd4). Not saved."
source = "investigation"
confidence = "high"

# ---- The dispatch's visit slots (context 2; SETADVFLAG clears them) ----

[[global]]
address = "0x211c93"
name = "visit_scenes_by_region"
category = "data-table"
type = "int[200]"
usage = "The visit on offer in each region, a scene number or -1: SETADVFLAG@0x15 clears it, SCJUMP's context-2 rules fill it (the same pattern as SCJUMP@0x46e5..0x4733), ALLMAP offers and plays it for the region G[0x19a329] (ALLMAP@0x6de..0x6fa) and reads it again as it draws the map (ALLMAP@0x4c36, @0x526c; what for is not checked). Three cells per slot at G[0x21252b] go with it (not decoded). Not saved."
source = "investigation"
confidence = "med"

[[global]]
address = "0x211d5b"
name = "visit_scenes_by_object"
category = "data-table"
type = "int[1000]"
usage = "The visit on offer at each domain object, a scene number or -1, keyed by an OBINIT object id (REIGN@0xa81 G[0x8f1152 + id]): SETADVFLAG@0x23 clears it, SCJUMP's context-2 rules fill it, REIGN offers and plays it (REIGN@0xad7..0xafb, @0x33bc). Three cells per slot at G[0x212783] go with it (not decoded). Not saved."
source = "investigation"
confidence = "med"

[[global]]
address = "0x212143"
name = "visit_scenes_by_character"
category = "data-table"
type = "int[1000]"
usage = "A third set of visit slots, a scene number or -1: SETADVFLAG clears it, SCJUMP's context-2 rules fill it, PALACE plays it from its grid of characters (PALACE@0x7d6..0x7ed) and REIGN from the list G[0x67a5] (REIGN@0x1d5e..0x1d90). Keyed by a character id: inferred from PALACE's grid, not checked against CHINIT. Three cells per slot at G[0x21333b] go with it (not decoded). Not saved."
source = "investigation"
confidence = "low"

# ---- CGINIT and the CG gallery ----

[[global]]
address = "0x2253d3"
name = "cg_pictures"
