# vm-map/globals-koukaku.toml -- CANONICAL living global-variable registry for 魔導巧殻
# (koukaku, SYS4443; hand-edited). Global addresses are per game, so this is separate from the
# other games' registries; the schema is identical (the type implies the bank: `string...` entries are
# string-bank cells, everything else integer cells).
# Generated artifacts (build/games/koukaku/globals.json, docs/global-reference-koukaku.md) come from
# this file via `tools/globals_build.py --game koukaku --build`. Do not edit those.
# Layouts and evidence: docs/koukaku-data-tables.md. Only what is understood has a name here.
[meta]
note = "Curated koukaku global addresses. Names started 2026-11-26 from the table layouts of tools/init_layout.py and their consumers (docs/koukaku-data-tables.md)."


# ==== The boot: options, SYSTEM4's and INIT2's constants, the hook chains ====

# ---- The options (INITCONFIG; the shared profile keeps them) ----

[[global]]
address = "0x1a7"
name = "message_font_name"
category = "ui-toggle"
type = "string"
usage = "The message font, メイリオ by default (INITCONFIG@0x0). SYSTEM4@0x2c9 sets it with set-font; CHECKCONFIG@0x0..0x18 puts ＭＳ 明朝 in its place when it is not installed. Saved, and kept in the shared profile."
source = "investigation"
confidence = "high"

[[global]]
address = "0x1a8"
name = "ui_font_name"
category = "ui-toggle"
type = "string"
usage = "The screens' font, ＭＳ ゴシック by default (INITCONFIG@0x8): ALCHEMY, ALLMAP, ARMAMENT, BREED, CONQUEST and the other screens set it. CHECKCONFIG@0x1b..0x33 puts ＭＳ ゴシック back when it is not installed. Saved, and kept in the shared profile."
source = "investigation"
confidence = "high"

[[global]]
address = "0xc56"
name = "confirm_save_load"
category = "ui-toggle"
type = "int"
usage = "1 by default (INITCONFIG@0x10). While it is above 0, SAVE asks ロードしますか？ or セーブしますか？ before it loads or saves (SAVE@0x6fc, @0x7c1). Saved, and kept in the shared profile."
source = "investigation"
confidence = "high"

[[global]]
address = "0x63b0"
name = "confirm_commands"
category = "ui-toggle"
type = "int"
usage = "1 by default (INITCONFIG@0x18). While it is set, a command asks first: タイトル画面に戻りますか？ (MENU@0x592), 討伐戦を開始しますか？ and 戦闘を放棄して撤退しますか？ (CONQUEST); ORGANIZE reads it too. Saved, and kept in the shared profile."
source = "investigation"
confidence = "high"

[[global]]
address = "0x63b3"
name = "autosave_off"
category = "ui-toggle"
type = "int"
usage = "0 by default (INITCONFIG@0x28). ALLMAP autosaves (its comment オートセーブ実行, ALLMAP@0x2add) only while it is 0 and G[0xc58] is 0 (ALLMAP@0x2ac1..0x2ad6). Saved, and kept in the shared profile."
source = "investigation"
confidence = "med"

[[global]]
address = "0x63b7"
name = "message_window_colour"
category = "ui-toggle"
type = "int"
usage = "The message window's colour, 0 by default (INITCONFIG@0x50): a scene draws the window with it, gfx-draw-color 0xd2f0 0 (alpha G[0x211c12]) (colour G[0x63b7]) (SC0000@0xf6e9, @0xf729); BUNKI, HISTORY and HMODE read it too. Saved, and kept in the shared profile."
source = "investigation"
confidence = "med"

[[global]]
address = "0x63b8"
name = "voice_continues_past_page"
category = "ui-toggle"
type = "int"
usage = "1 by default (INITCONFIG@0x58). While it is 0, a page's end resets the voice (reset-message-voice-state, SC0000@0x1030b, @0x104c3), so the voice stops when the page turns. Saved, and kept in the shared profile."
source = "investigation"
confidence = "med"

[[global]]
address = "0x63b9"
name = "speaker_text_colour_mode"
category = "ui-toggle"
type = "int"
usage = "1 by default (INITCONFIG@0x48). 1: a page's text takes the speaker's effect colour from G[0x63ba] (CHECKCONFIG@0x52..0xd7, SC0000@0x10c1a); -1: white text, render mode 1, no effect offset (CHECKCONFIG@0xdf..0xfe); any other value keeps 0x3a3a3a. Saved, and kept in the shared profile."
source = "investigation"
confidence = "high"


