[[scope]]
name = "battlefield"
first = 1
last = 221
usage = "A battlefield map, by battlefield_map_id (MPINIT's ids 1..0x64 and 0xc9..0xdd; a region's map is G[0x8e0330 + region], a story battle's is set by DUINIT). FIELD walks the MPINIT chain G[0xa6b899] to fill these tables for the map in play; MPINIT writes only the map's cells and clears nothing."

[scope.tables]
cell = "battlefield_cell"
entry = "battlefield_entry"
