name = "neighbour_dx"
category = "data-table"
type = "int[8]"
usage = "The x of the eight steps to a cell's neighbours, -1, 0, 1, 0, -1, 1, 1, -1 (left, up, right, down, then the diagonals; INIT2@0x1d7). SETROUTE adds it to a cell's x (SETROUTE@0x67a); CRAFTACT, RTN_M011 and SETENTRY read it too. Rebuilt at boot."
source = "investigation"
