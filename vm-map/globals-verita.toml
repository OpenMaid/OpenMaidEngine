# vm-map/globals-verita.toml -- CANONICAL living global-variable registry for Verita
# (戦女神VERITA, SYS4424; hand-edited). Global addresses are per game, so this is separate from the
# other games' registries; the schema is identical (the type implies the bank: `string...` entries are
# string-bank cells, everything else integer cells).
# Generated artifacts (build/games/verita/globals.json, docs/global-reference-verita.md) come from
# this file via `tools/globals_build.py --game verita --build`. Do not edit those.
# Layouts and evidence: docs/verita-data-tables.md. Only what is understood has a name here.
[meta]
note = "Curated Verita global addresses. Names started 2026-11-25 from the ADV prelude (mods/verita-base/oms/adv.oms) and the table layouts of tools/init_layout.py."


# ---- ADV page state (mods/verita-base/oms/adv.oms) ----

[[global]]
address = "0x3489"
name = "adv_speaker_id"
category = "index-pointer"
type = "int"
usage = "The page's speaker: an index into CNINIT's names, or -1 for narration. Every spoken page sets it before show_speaker, which draws the name plate from it; clear_speaker sets -1."
source = "investigation"
confidence = "high"

[[global]]
address = "0x348a"
name = "adv_page_has_text"
category = "ui-toggle"
type = "int"
usage = "1 once a page has text: every dialogue page sets it first, clear_message_text clears it, and publish_message_text publishes the layout only while it and the window are shown."
source = "investigation"
confidence = "high"

[[global]]
address = "0x915"
name = "adv_message_window_shown"
category = "ui-toggle"
type = "int"
usage = "Whether the message window is shown: the window transitions set it to 1 to draw the window, then to the state they leave (1 to show, 0 to hide); draw_message_window draws only while it is set."
source = "investigation"
confidence = "high"

[[global]]
address = "0x917"
name = "adv_chrome_enabled"
category = "ui-toggle"
type = "int"
usage = "Whether the message window's buttons (skip, history, auto, hide) are registered and drawn: register_adv_hotspots and draw_message_window test it; a scene's setup sets it to 1."
source = "investigation"
confidence = "high"

# ---- Shared script arguments (vm-map/patch-points-verita.toml) ----

[[global]]
address = "0x5dda74"
name = "character_arg_id"
category = "index-pointer"
type = "int"
usage = "The character the shared character scripts work on (ADDEXP, CALCREVISE, CALCLVUP, CHECKSKILL and 153 more read it); a caller sets it before running them, and INIT2 and RESULT loop it over the characters."
source = "investigation"
confidence = "high"

[[global]]
address = "0x269b2c"
name = "shared_number"
category = "index-pointer"
type = "int"
usage = "A number scripts hand each other or use as scratch (547 scripts: loop indexes, picture queries, amounts). ADDEXP reads it as the experience to add, which its callers set just before calling it (RESULT@0x9a9 and 16 more)."
source = "investigation"
confidence = "high"

