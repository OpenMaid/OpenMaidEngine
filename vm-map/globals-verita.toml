[[table]]
name = "element"
records = 20
built_by = "boot"
usage = "AFINIT's elements keyed by defense element id, 1 to 15 named, AFINIT writing no row past 15: a unit's and an item's defense element (unit_defense_elements, item_defense_elements). Row 0, 100 throughout, has no name in the game (the element kind titles it Undefined) and is the row of a unit with no element of its own: a battle unit takes its armour's defense element, else its unit's (SETCH@0xa82, SETEN@0xbfb), and 131 units have none, nor does the armour they start with give one. Column 0, 100 throughout, no attack reaches: CALCDAMAGE takes the action's attack element, else the attacker's weapon's (CALCDAMAGE@0x1a2), which SETCH and SETEN alone write, the weapon's or 2 物理 without one (SETCH@0x9d9, SETEN@0xb52), and every weapon has one. Each row is how the element takes each attack element (element_affinities, its columns named by attack_element_names). Attack element n is element n up to 9: the two lists name 1 to 9 alike, and the matrix pairs them, 火炎, 冷却, 電撃 and 地脈 (4 to 7) taking -100 of their own attack element. The attack elements above 9 are no element: 10 戦意 is every 戦意 attack's (item_damage_kinds 5), and 11 to 17, 抵抗1 to 7, are the columns that scale a condition's chance (condition_affinity_columns, CALCILL@0x5ec), 抵抗3 being also the attack element of seven mind checks (item_damage_kinds 3)."

[table.fields]
name = "defense_element_names"
affinities = "element_affinities"

