# ---- Tables ----

[[table]]
name = "scene"
records = 10000
built_by = "boot"
usage = "SCINIT scenes keyed by scene id: SCJUMP names one, SYSTEM4 plays its script."

[table.fields]
script = "scene_script_ids"
offer_context = "scene_offer_contexts"

[[table]]
name = "objective"
records = 2000
built_by = "boot"
usage = "FAINIT objectives, the 情報 screen INFO1: listed in sort-key order while their flags allow."

[table.fields]
sort_key = "objective_sort_keys"
required_flags = "objective_required_flags"
done_flags = "objective_done_flags"
chapter = "objective_chapters"
text = "objective_texts"

[[table]]
name = "glossary_entry"
records = 1000
built_by = "boot"
usage = "VIINIT glossary entries, the screen INFO2; the text comes through the VIMES chain."

[table.fields]
title = "glossary_titles"
unlock_scenes = "glossary_unlock_scenes"
picture = "glossary_pictures"
picture_x_offset = "glossary_picture_x_offsets"
picture_y_offset = "glossary_picture_y_offsets"

[table.refs]
unlock_scenes = { table = "scene", offset = -1 }
picture = "picture"

[[table]]
name = "quest"
records = 200
built_by = "inn"
usage = "QUINIT quests, rebuilt by the INN chain for the current inn: ids 1 to 99 every inn's, 100 to 199 the current inn's own."

[table.fields]
name = "quest_names"
text = "quest_texts"
prerequisite = "quest_prerequisites"
party = "quest_parties"
required_flags = "quest_required_flags"
barring_flags = "quest_barring_flags"
difficulty = "quest_difficulties"
money_reward = "quest_money_rewards"
reward_items = "quest_reward_items"
reward_counts = "quest_reward_counts"

[table.refs]
reward_items = "item"   # the ITINIT table, named in the items domain

[[table]]
name = "cg"
records = 2000
built_by = "boot"
usage = "CGINIT gallery CGs keyed by CG id; SETMEMOIR places each by tab, slot and variant."

[table.fields]
picture = "cg_pictures"
tab = "cg_tabs"
slot = "cg_slots"
variant = "cg_variants"
scroll_x = "cg_scroll_x"
scroll_y = "cg_scroll_y"
append_number = "cg_append_numbers"

[table.refs]
picture = "picture"

[[table]]
name = "replay"
records = 150
built_by = "boot"
usage = "SPINIT scene replays keyed by page * 15 + cell (10 pages of 15; HMODE shows 5, or 6 with an append)."

[table.fields]
script = "replay_scripts"
append_number = "replay_append_numbers"

[[table]]
name = "music_track"
records = 50
built_by = "boot"
usage = "MUINIT music room tracks keyed by their place in the room."

[table.fields]
bgm_number = "music_track_bgm_numbers"
unlock_resource = "music_track_unlock_resources"
