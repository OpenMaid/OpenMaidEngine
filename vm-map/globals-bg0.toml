[scope.tables]
block = "map_block"


# ==== Boot, scenes and galleries: INITCONFIG, INIT2, SCINIT, SCJUMP, VIINIT, CGINIT, SPINIT (docs/bg0-data-tables.md) ====

# ---- Boot: SYSTEM4's mode, INITCONFIG's options, INIT2's constants, the game mode ----

[[global]]
address = "0x0"
name = "system_mode"
category = "index-pointer"
type = "int"
values = { "1" = "scene", "2" = "ALLMAP", "3" = "FIELD", "4" = "BTL", "5" = "TOWN" }
usage = "Saved. The mode SYSTEM4 runs each pass (SYSTEM4@0x2ea..0x5d6): 1 a scene, 2 ALLMAP, 3 FIELD, 4 BTL, 5 TOWN; any other value shows 不正な実行モード and asks to exit (SYSTEM4@0x5dc). A SCJUMP rule that plays a scene sets 1 (SCJUMP@0x65); a scene's end sets 3, 2 or 5 (SC0000@0x4810, SC0000@0xf986..0xf9c3)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x3"
name = "config_initialized"
category = "ui-toggle"
type = "int"
usage = "A shared-profile cell. SYSTEM4@0x1c3 loads it; while it is 0, SYSTEM4@0x1d3 runs INITCONFIG, then sets it and stores it. Otherwise LOADCONFIG reads the options back (SYSTEM4@0x1cd)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x2fec"
name = "menu_cursor_auto_move_enabled"
category = "ui-toggle"
type = "int"
usage = "An option, 1 by INITCONFIG@0x10 and kept in the shared profile. While it is set, BUNKI@0x2a1 (and SBUNKI, BUNKIMOVE) put the cursor on a choice menu's first row; otherwise the cursor stays where it is (BUNKI@0x2e6). Himegari's option of the same name."
source = "investigation"
confidence = "high"

[[global]]
address = "0x9050e"
name = "confirm_escape"
category = "ui-toggle"
type = "int"
usage = "An option, 1 by INITCONFIG@0x8 and kept in the shared profile. While it is set, MENU@0x50d asks 脱出する / 脱出しない (SBUNKI) before the escape command runs SCJUMP's context 6."
source = "investigation"
confidence = "high"

[[global]]
address = "0x30ae"
name = "skip_read_messages_only"
category = "ui-toggle"
type = "int"
usage = "An option, 1 by INITCONFIG@0x33 and kept in the shared profile. With 1, a scene's skip button toggles read-message skip (SC0000@0x201..0x219); otherwise it turns message skip on, which skips every message (SC0000@0x21f)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x30af"
name = "map_frame_rate"
category = "ui-toggle"
type = "int"
usage = "An option, 60 by INITCONFIG@0x2b and kept in the shared profile; CONFIG@0x91c and @0x935 set 60 or 30. FIELD@0xaab waits 1000 / value ms a frame and FIELD@0x1063 steps 60 / value; DRAWWALK reads it too."
source = "investigation"
confidence = "med"

[[global]]
address = "0x91027"
name = "scene_graphic_element_numbers"
category = "data-table"
type = "int[17]"
usage = "INIT2@0x4c..0x6f: [n] = 10000 + 10n for layers 0, 1 and 11 to 16; [2..10] have no writer and no reader. A scene sets the layer in G[0x91022] and transforms element [layer] (SC0000@0xfee1..0xff3c)."
source = "investigation"
confidence = "med"

[[global]]
address = "0xc57bb"
name = "party_name_x"
