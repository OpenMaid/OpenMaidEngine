usage = "ITINIT: the category, 1..46 (21..34 the magic schools, 41..46 the art schools; 8 also the enemies' actions and 9999 素手). ITMES@0x6 dispatches on it; CHMODE1@0x18c0 tests it against the character's mask G[0xa2ae5 + kind]; SHOP@0x27b0 draws its icon; CHECKACT@0x130 and CHMODE3@0x15f7 test the weapon an art needs."
source = "investigation"
confidence = "high"

[[global]]
address = "0x12f1cd"
