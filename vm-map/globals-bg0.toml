values = { "0" = "story", "1" = "debug script", "-1" = "debug ADV", "-2" = "特別編" }
usage = "How SYSTEM4 plays a scene. 0, the story: SYSTEM4@0x2f9 records scene_seen_flags and @0x44a reads scene_script_ids. 1, TITLE@0x678's SC????.BIN pick: SC0000@0x475 takes its debug path. -1, DEBUGADV and DEBUGADV2 (TITLE@0x69e, 0x6bc): neither. -2, 特別編 (GAMESTART@0x3b8, CALLBACK_LOAD@0xc): the table is read, nothing recorded. 100 scripts reset it to 0. Above the saved prefix."
