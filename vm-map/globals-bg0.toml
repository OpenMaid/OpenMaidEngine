[[global]]
address = "0x9186a"
name = "played_scene_id"
category = "index-pointer"
type = "int"
usage = "The scene a map event's inline scene pass last played. MPEV01B0102@0x21a copies current_scene_id into it and repeats the pass while the two differ (@0x20c), so a scene that sets current_scene_id chains to the next; 283 map events hold this loop."
source = "investigation"
confidence = "med"

[[global]]
