usage = "ITINIT: the item's name (742 written, 嵐神の鍵 …, 9999 素手); ARENA, BTL, CHMODE1, CHMODE3, DRAWCHP, DRAWENLIST, GETITEMMES, INFO4, RESULT and SHOP draw it."
