usage = "A scene is playing over the map. A map event (MPEV01B0102@0x1d0, 128 MPEV scripts), HOSOKU and MENU@0x5dc set it around their inline scene pass and clear it after (MPEV01B0102@0x49a). While it is set, the scene pass erases only graphic elements 10000..49999 instead of every retained object (SYSTEM4@0x34a), and SYSTEM4@0x435 copies another inline array into G[0x2fd3]."
source = "investigation"
confidence = "med"

[[global]]
