category = "data-table"
type = "int[10000]"
usage = "SCINIT's first pass (SCINIT@0x0..0x776) writes the SCJUMP context that offers the scene, 1, 2, 3, 5 or 6 on 164 scenes; they agree with SCJUMP's rules except 395 and 1510, which no rule names. The second pass (SCINIT@0x77b..) sets -1 on 669 scenes, so 32 keep a context. Each scene's header (SC0000@0x15f) registers the right-click menu unless in_room is set or the value is 4, which no scene has."
source = "investigation"
confidence = "med"

[[global]]
