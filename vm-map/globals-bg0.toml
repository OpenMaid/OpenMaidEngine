usage = "The scene to play, an id of SCINIT. A SCJUMP rule (SCJUMP@0x6f), a map event (MPEV01B0102@0x1d5) or TITLE@0xa10 sets it; SYSTEM4@0x46d plays it and a scene script dispatches on it (SC0000@0x729). A scene's end sets 0 (SC0000@0x481a). Above the saved prefix."
source = "investigation"
confidence = "high"

[[global]]
