usage = "Saved: the game mode, 0 通常 or 1 特別編. GAMESTART@0x7b stores the BUNKI choice G[0x94f67] (GAMESTART@0x1f..0x78). While it is set, $1$AUTORUN runs $1$AMINIT and $1$SIINIT (@0xf) and $1$SCINIT (@0x3a); ALLMAP@0x5a, TOWN@0x5d, FIELD@0x7b and CALLBACK_LOAD@0xd1 run $1$AMINIT, $1$SIINIT and $1$RMINIT in place of the base scripts; and every SCJUMP caller runs $1$SCJUMP (ALLMAP@0x31, FIELD@0x13b, TOWN@0x39, TOWN@0x522, BTL@0x706a, MENU@0x58a). It is 0 at the boot, so a new 特別編 game runs $1$CHINIT and $1$SCINIT itself (GAMESTART@0x3ab..0x3b5); INIT2 runs on every load after the saved prefix is back, so a 特別編 save loads those tables again. The same base also indexes shared-profile flags: [cg] an append CG's unlock ($1$SC0060@0x4b01, CGMODE@0x9b7), [800 + slot] a save slot's (SAVE@0xd13; not decoded)."
source = "investigation"
confidence = "high"

# ---- Scenes: SCINIT, the scene pass, SCJUMP ----

[[global]]
address = "0xbc8f6"
name = "scene_script_ids"
category = "data-table"
type = "int[10000]"
usage = "SCINIT: the script that plays scene [id], a packed script id (0x28 SC0000.BIN; an append's scene carries selector 1 in the top byte, 0x1000183 $1$SC0000.BIN). SYSTEM4@0x46d copies it into current_scene_script_id and runs it; MENU@0x733 runs it directly. $1$SCINIT, run in 特別編 only, gives scenes 0, 1, 10..13, 20..23, 30..34, 40..44, 50..54, 60..63 and 100 to append scripts."
source = "investigation"
confidence = "high"

[[global]]
