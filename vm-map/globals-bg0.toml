picture_y_offset = "glossary_picture_y_offsets"

[table.refs]
unlock_scenes = { table = "scene", offset = -1 }
picture = "picture"

[[table]]
name = "cg"
records = 2000
built_by = "boot"
usage = "CGINIT gallery CGs keyed by CG id, 1 to 715; CGMODE places each by tab, slot and variant."

[table.fields]
