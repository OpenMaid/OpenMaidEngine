# vm-map/globals-bg0.toml -- CANONICAL living global-variable registry for 戦女神ZERO
# (bg0, SYS4415; hand-edited). Global addresses are per game, so this is separate from the
# other games' registries; the schema is identical (the type implies the bank: `string...` entries are
# string-bank cells, everything else integer cells).
# Generated artifacts (build/games/bg0/globals.json, docs/global-reference-bg0.md) come from
# this file via `tools/globals_build.py --game bg0 --build`. Do not edit those.
# Layouts and evidence: docs/bg0-data-tables.md. Only what is understood has a name here.
[meta]
note = "Curated bg0 global addresses. Names started 2026-11-25 from the ADV prelude (mods/bg0-base/oms/adv.oms) and the table layouts of tools/init_layout.py."


[[global]]
address = "0x2fd0"
name = "adv_speaker_id"
category = "index-pointer"
type = "int"
usage = "The page's speaker: an index into CNINIT's names (speaker_names), or -1 for narration. Every spoken page sets it, draws the name plate from it (SC0470@0x00b81) and mutes the voice when it is below 0 or its voice setting's switch is set (SC0470@0x00bb8..0x00bdf); a page without a speaker sets -1 (`$1$MPEV49F0101@0x00194`)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x2fd1"
name = "adv_page_has_text"
category = "ui-toggle"
type = "int"
usage = "1 once a page has text: every dialogue page sets it first (142 scripts, SC0470@0x00460), and the special mode's event scripts clear it (`$1$MPEV49F0101@0x005ee`)."
source = "investigation"
confidence = "med"

[[global]]
address = "0x2be7"
name = "voice_mute_switches"
category = "ui-toggle"
type = "int[16]"
usage = "Saved, and kept in the shared profile: a switch per voice setting (CVINIT's 0 to 15), 1 to mute it. INITCONFIG@0x3b clears them and stores them (@0x5d); the Option screen sets one and stores it (CONFIG@0xeb0..0xeea). A scene mutes the next voice when the speaker's is set, G[0x2be7 + unit_voice_settings[speaker_voice_units[adv_speaker_id]]] (SC0470@0xbd8, SC0000@0xeaa); BTL (@0x19aa), HISTORY and ANIME read it by a unit's setting."
source = "investigation"
confidence = "high"

[[global]]
address = "0x8fd3d"
name = "speaker_heard_flags"
category = "data-table"
type = "int[1000]"
usage = "Kept in the shared profile: 1 once the speaker (a CNINIT id, the same number as its unit) has talked. Every spoken page sets it and stores it (SC0470@0x00b62..0x00b75); the 設定 voice page shows a setting's row once its unit is heard (CONFIG@0x010e7), and the 人物 book names a profile so (INFO2@0x00876)."
source = "investigation"
confidence = "high"


# ---- Shared script arguments ----

[[global]]
address = "0x8b158"
name = "character_arg_id"
category = "index-pointer"
type = "int"
usage = "The character the shared character scripts work on: ADDEXP, ADDSKILL, BTLMENU, CALCLVUP, CALCNEXTEXP, CALCREVISE, LEAVECH, RETIRECH, SETCH and USESKILL read it and never set it. A caller sets it before running them (83 scripts do), and INIT2@0xb9..0xeb loops it over characters 1 to 99 for CALCREVISE. It lies below the saved prefix, so a save holds its last value."
source = "investigation"
confidence = "high"

[[global]]
address = "0x91865"
name = "script_arg_1"
category = "index-pointer"
type = "int"
usage = "The first argument a script passes to the one it calls, set before call-script. ADDHP, ADDMP and ADDTP (@0x1), GETMAPEVF (@0x5), GETMONEYMES (@0x378) and ADDEXP (@0x16) read their input from it; SHOWALLMAP takes it as the story part whose world map it shows (SHOWALLMAP@0xf), restoring the old part at @0x375; ADDEXP passes CALCLVUP a character's new level in it (ADDEXP@0x114, CALCLVUP@0x13)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x91866"
name = "script_arg_2"
category = "index-pointer"
type = "int"
usage = "The second argument, set beside script_arg_1. GETMAPEVF reads it (@0xa); ADDEXP passes CALCLVUP the level before in it (ADDEXP@0x119), and CALCLVUP takes script_arg_1 - script_arg_2 (@0x18); SHOWALLMAP takes it as the area to highlight with its area_pictures column 1 (SHOWALLMAP@0x14, @0xb2), standing in current_place_id until @0x375."
source = "investigation"
confidence = "high"


