usage = "Saved. Which of SCJUMP's rule lists runs (SCJUMP@0x0). 1 ALLMAP@0x2c each world map pass; 2 FIELD@0x136 and TOWN@0x34 on entry (rules test story_part and the map G[0x30b2]); 3 TOWN@0x51d for each location (rules test town_site_id); 5 BTL@0x7065 after a battle; 6 MENU@0x585, the escape command. 4 is never set and its list is empty. BTL and MENU restore the old value after."
source = "investigation"
confidence = "high"

[[global]]
