usage = "Saved: the game's flags, by scene. Each scene's own code sets [scene] to 1 at its start (SC0000@0x7b5 for scene 0; 649 of the 701 SCINIT scenes). SCJUMP's rules test them (144 of the 184 ask that their own scene's is not 1), as do $1$SCJUMP@0x57 and AMINIT ([9999], which nothing writes). No scene has an id from 1900 to 1999: [1900 + item] is a key item held, item_key_held_flags (ADDITEM@0x78..0xe7)."
source = "investigation"
confidence = "high"

[[global]]
