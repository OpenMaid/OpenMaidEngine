# ---- Tables ----

[[table]]
name = "scene"
records = 10000
built_by = "boot"
usage = "SCINIT scenes keyed by scene id: SCJUMP or a map event names one, SYSTEM4 plays its script. 特別編 lays $1$SCINIT's 30 scenes over the base ones."

