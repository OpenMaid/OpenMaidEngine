# ==== The world: AMINIT, SIINIT, MPINIT, RMINIT, LAINIT, OBINIT, OBINIT2, CPINIT (docs/bg0-data-tables.md) ====

# ---- Selectors and field state ----

[[global]]
address = "0x30b0"
name = "story_part"
category = "index-pointer"
type = "int"
usage = "Saved: the story's part, 1 to 4, and with it the world map in play. GAMESTART@0x665 (通常) and TITLE@0x633 set 1, SC0180@0x11ae0 2, SC0500@0x129a8 3 and SC0390@0x1b880 4, as GAMESTART@0x423 does for 特別編. AMINIT dispatches on it (AMINIT@0x32), world_map_pictures is indexed by it, SCJUMP's rules test it, and CHANGECHAPTER@0x1b..0x40 turns it into lead_unit_id. Not the chapter: the chapter's name is GS[0xdc], which each scene sets (SC0000@0x7be)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x30b1"
name = "lead_unit_id"
category = "index-pointer"
type = "int"
usage = "Saved: セリカ's unit for the world map in play, 1 to 4. CHANGECHAPTER@0x1b..0x3d sets it from story_part, @0x40 makes it his unit (character_unit_ids[1]), and @0x45, @0x18a and @0x37f read CBINIT's row and that unit's EBINIT fields by it. CPINIT's field sheets are read by it too (FIELD@0x1806, DRAWJUMP@0xe8)."
source = "investigation"
confidence = "high"

[[global]]
address = "0x30b2"
name = "current_place_id"
category = "index-pointer"
type = "int"
usage = "Saved: the place in play, an area id: a map 1 to 49 (FIELD) or a town from 50 (TOWN). ALLMAP@0x78d sets it on entering an area; MPINIT, RMINIT and SIINIT are read by it (FIELD@0xba, FIELD@0x88, TOWN@0x6a) and RMINIT and SIINIT branch on it."
source = "investigation"
confidence = "high"

[[global]]
address = "0x3149"
name = "town_site_id"
category = "index-pointer"
type = "int"
usage = "Saved: the town site TOWN is about to offer: TOWN@0x518 sets it for each site, and TOWN@0x51d runs SCJUMP's context 3, every rule of which tests it (SCJUMP@0x1480)."
