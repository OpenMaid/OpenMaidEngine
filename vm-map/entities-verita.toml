[[kind]]
id = "item"
table = "item"
about = "Every item, weapon, armour, spell and art, and the enemies' actions: rank and class, elements, area, bonuses, costs, conditions, prices and growth."
exists = "name"
title = "name"
# A school's tree (SKINIT) names an action's prerequisites, and IMINIT an equipment's growth, by the item's id.
joins = ["item_growth", "action_tree"]
fields = [
    "category", "class", "rank", "damage_kind", "attack_element", "attack_element_level", "defense_element",
    "defense_element_level", "reach", "target_kind", "area_width", "area_height",
    "owners", "exclusive_users", "required_skill", "female_only", "cursed", "once_per_battle", "charges",
    "accuracy", "evasion", "physical_attack", "physical_defense", "attack_count", "defense_count", "magic_attack",
    "magic_defense", "magic_power", "physical_resistance", "mental_resistance", "physical_speed", "mental_speed",
    "luck", "ct_rate", "max_hp", "max_mp", "max_tp", "hp", "mp", "tp", "fs", "control_rate_change",
    "condition_levels", "equip_condition_levels", "granted_skill", "granted_skill_level", "buy_price", "sell_price",
    "item_growth.kind", "item_growth.costs", "item_growth.accuracy", "item_growth.evasion",
    "item_growth.physical_attack", "item_growth.physical_defense", "item_growth.attack_count",
    "item_growth.defense_count", "item_growth.magic_attack", "item_growth.magic_defense", "item_growth.magic_power",
    "item_growth.physical_speed", "item_growth.mental_speed", "item_growth.ct_rate", "item_growth.element_level",
    "item_growth.result_item", "action_tree.prerequisites",
]
filters = ["category", "class", "rank", "damage_kind"]
# A player's spell and an enemy's action may share a name: the class (敵魔, 敵必) and the rank tell them apart.
qualifiers = ["class", "rank"]

# A row for each growth level the item reaches, from the first: what that level adds.
