# 戦女神VERITA's entity declarations: what the project site publishes of the game's data (game data export spec §5).
# Hand-edited; tools/entities_build.py checks it against vm-map/globals-verita.toml (its tables, their [table.refs],
# its globals), vm-map/patch-points-verita.toml and the profile's saved prefix, and writes
# build/games/verita/entities.json for the exporter. The tables are described in docs/verita-data-tables.md.
#
# The conventions are Kamidori's (vm-map/entities-kamidori.toml): scripts named without the `$n$` prefix and `.BIN`;
# the story flags and scenes that gate a record left to the modder data; a field published when it means something to
# a player, so sort keys, append stamps, routines, sound and sprite machinery stay modder data; what a value means left
# to the registry's value facets (words, the game's names, scale); and a note only where the label and value leave a
# reader guessing. A field whose meaning the data document does not state is not published.
#
# ITINIT is one table for items, equipment, spells, arts and the enemies' actions, and it is one kind here: the
# exporter links every reference to a table to that table's first kind, so a kind for each id range would leave the
# drops, recipes and treasures that name a weapon or a spell linking to the wrong kind. Its category and class are
# its filters instead.

[export]
# The tables as the game plays with them: INIT2's exit, after every layer (docs/verita-data-tables.md, "How the data
# gets into memory").
boot = { script = "INIT2", read_at = "verita.boot.data_ready" }
# The scripts whose stored values may be published: INIT2 itself (it writes the hook chains and its constants), the
# *INIT and *INIT2 table scripts (AMINIT2, OBINIT2, BTANINIT2) and their `$n$` layers, and AUTORUN, which the appends
# run.
builders = ["INIT2", "*INIT", "*INIT2", "AUTORUN"]
# Never builders, whatever matches them: the CG gallery (CGINIT) and the H-scene replays (SPINIT).
excluded_builders = ["CGINIT", "SPINIT"]
# No derived scripts: INIT2's CALCREVISE runs only for a character who has joined (G[0x118fd8 + i] & 0x101 == 1, a
# saved cell, 0 at a cold boot), and its three re-entries (RMINIT, the map's picture, QUINIT) only on a load.
# The information screens whose shown text is data: the item descriptions (ITMES), the skill descriptions (SSMES), the
# glossary (VIMES) and the character profiles (CIMES). TIMES, the titles' text, is not one: the cell it branches on,
# G[0xaa108c], is in neither the data document nor the registry. Each is a hook chain whose base comes first, and a
# description runs the base script alone, so a record an append adds has its text in that append's `$n$` layer only.
text_scripts = ["ITMES", "SSMES", "VIMES", "CIMES"]
# The pictures the site shows blurred until a click: nudity, by catalog name. Found by looking at every picture the
# declarations publish (2026-11-25, 838 pictures): one battle figure, the bottomless girl CPB088A, and the nude plant
# girl, whose character art CD056A shares its art with the status pictures CS026AA and CS026ZA (her battle figures,
# CPB026A and CPB645A, show none of it). Revealing but covered art (CS108AA, CS105AA, CS058AA, CS012AA, the angels
# CD055A, CS025AA and CS037AA, the event picture EI055) and the featureless bodies of the water and ice elementals
# (CD061A, CPB141A to CPB146A) are not on the list.
explicit_pictures = ["CPB088A", "CD056A", "CS026AA", "CS026ZA"]

[[kind]]
id = "unit"
table = "unit"
about = "Every enemy, and the body each party character fights with: its stats at its base level and their growth, equipment, skills, drops and capture."
exists = "name"
title = "name"
text = ["description"]
fields = [
    "sex", "boss_class", "width", "height", "defense_element", "defense_element_level",
    "base_level", "max_level", "max_hp", "max_mp", "max_tp", "attack", "defense", "magic_attack", "magic_defense",
    "attack_count", "defense_count", "physical_resistance", "mental_resistance", "physical_speed", "mental_speed",
    "luck", "max_hp_growth", "max_mp_growth", "max_tp_growth", "attack_growth", "defense_growth",
    "magic_attack_growth", "magic_defense_growth", "attack_count_growth", "defense_count_growth",
    "physical_resistance_growth", "mental_resistance_growth", "physical_speed_growth", "mental_speed_growth",
    "luck_growth", "accuracy", "evasion", "starting_fs", "max_fs",
    "weapon", "armor", "accessory", "action_ids", "skill_levels", "money", "drop_items", "drop_chances",
    "capture_item", "capture_level",
]
filters = ["boss_class", "defense_element", "sex"]
# Units of one name differ by the level their stats are given at.
qualifiers = ["base_level"]
marks = { boss_class = "Boss" }
# The battle sprite (a CPB… picture), and the bestiary's own picture where it is not the sprite (an EI… picture).
pictures = { sprite = "battle_sprite", bestiary = "book_picture" }

[[kind.group]]
name = "drops"
fields = ["drop_items", "drop_chances"]

[kind.labels]
description = "How it fights"
width = "Width in cells"
height = "Height in cells"
defense_element_level = "Defense element level"
weapon = "Weapon"
armor = "Armour"
accessory = "Accessory"
action_ids = "Actions"
skill_levels = "Skills"
drop_items = "Item"
drop_chances = "Chance (%)"
capture_item = "Captured, gives"
capture_level = "捕縛 level needed"
starting_fs = "Starting FS"
max_fs = "Max FS"

[kind.notes]
boss_class = "The highest boss class among a battle's enemies picks the battle's music."
defense_element = "It takes this one where its armour gives none."
base_level = "The level its stats are given at: each grows by its growth for every level above it."
max_level = "An enemy's level lies between its base and max levels, and rises toward the party's average level."
action_ids = "The actions its AI may use; an empty slot is its weapon."
skill_levels = "Its level of each skill; a character's title adds its own, to at most 5."
money = "Paid for each defeat; a character's unit gives it to the party on joining."
drops = "Each item a defeat may drop and its chance; a character's unit gives them to the party on joining."
capture_item = "The summon stone gained by capturing it with 性魔術, which needs the 捕縛 level beside it."
starting_fs = "An enemy's FS when the battle starts."

[kind.referenced_as]
weapon = "Initial weapon of"
armor = "Initial armour of"
accessory = "Initial accessory of"
action_ids = "Used by units"
skill_levels = "Units that have it"
drop_items = { heading = "Dropped by", details = ["drop_chances"] }
capture_item = { heading = "Gained by capturing", details = ["capture_level"] }

