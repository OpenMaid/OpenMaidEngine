name = "growth"
fields = [
    "item_growth.accuracy", "item_growth.evasion", "item_growth.physical_attack", "item_growth.physical_defense",
    "item_growth.attack_count", "item_growth.defense_count", "item_growth.magic_attack",
    "item_growth.magic_defense", "item_growth.magic_power", "item_growth.physical_speed",
    "item_growth.mental_speed", "item_growth.ct_rate", "item_growth.element_level",
]

