[[kind]]
id = "objective"
table = "objective"
about = "The objectives the game lists by chapter."
exists = "text"
title = "text"
text = ["chapter"]
qualifiers = ["chapter"]

[[kind]]
id = "formation"
table = "formation"
about = "The party's formations and the effects each lists."
exists = "name"
title = "name"
text = ["effect_lines"]

[kind.labels]
effect_lines = "Effects"

# The war game (SLG): its terrain, troops, commanders, tactics and ranks.

[[kind]]
id = "terrain"
table = "terrain"
about = "The war game's terrain, and what moving through it costs each move type."
exists = "name"
title = "name"
fields = ["move_costs"]

[kind.labels]
move_costs = "Move cost"

[kind.notes]
move_costs = "0: the move type cannot enter it."

[[kind]]
id = "troop"
table = "troop"
about = "The war game's troops: move type, move, attack, defence and magic, soldiers, morale and own tactic."
exists = "name"
title = "name"
fields = ["move_type", "stats", "tactic", "soldiers", "morale"]
filters = ["move_type"]
pictures = { sprite = "sheets.side_1" }

[kind.labels]
morale = "Starting morale"

[kind.notes]
stats = "Its move range is its move plus 1."
morale = "Its attack is multiplied by (100 + morale) / 100."

[kind.referenced_as]
tactic = "Troops with it"

[[kind]]
id = "commander"
table = "commander"
about = "The war game's commanders: leadership, the attack of their tactics, and their own tactic."
exists = "name"
title = "name"
fields = ["leadership", "attack", "tactic"]
pictures = { sprite = "sheets.map", large = "sheets.large" }

[kind.notes]
leadership = "It divides the morale its unit loses."
attack = "The attack of the commander's tactics."

[kind.referenced_as]
tactic = "Commanders with it"

[[kind]]
id = "tactic"
table = "tactic"
about = "The war game's tactics: kind, range, power and cooldown."
exists = "name"
title = "name"
text = ["description"]
fields = ["kind", "min_range", "max_range", "power", "cooldown"]
filters = ["kind"]

[kind.notes]
cooldown = "1: always usable; n: unusable for n - 1 turns after use."

[[kind]]
id = "rank"
table = "rank"
about = "The war game's ranks: the war points each needs, and its bonuses to the player's units."
exists = "name"
title = "name"
fields = ["points", "bonuses"]

[kind.labels]
points = "War points needed"
