# 魔導巧殻's entity declarations: what the project site publishes of the game's data (game data export spec §5).
# Hand-edited; tools/entities_build.py checks it against vm-map/globals-koukaku.toml (its tables, their [table.refs], its
# globals), vm-map/patch-points-koukaku.toml and the profile's saved prefix, and writes build/games/koukaku/entities.json
# for the exporter. The tables are described in docs/koukaku-data-tables.md.
#
# The conventions are Kamidori's (vm-map/entities-kamidori.toml), as Verita's and 戦女神ZERO's are: scripts named without
# the `$n$` prefix and `.BIN`; the story flags and scenes that gate a record left to the modder data; a field published
# when it means something to a player, so sort keys, routines, voices, animations, sound and sprite machinery stay
# modder data; what a value means left to the registry's value facets (words, the game's names, scale); and a note only
# where the label and value leave a reader guessing. A field whose meaning the data document does not state, or states
# only as inferred, is not published.
#
# The game keeps its stats in rows of 11 cells whose columns the registry names only for the characters and titles
# (control, hp …). An item's, a part's and a costume's stats, and a troop's and a formation's parameters, are published
# column by column, each labelled with the game's word for it (docs/koukaku-data-tables.md, CHINIT's note on the 11
# stat columns; TRINIT's troop_parameters).
#
# What is not a kind here, and why:
# - The alchemy recipes (ALINIT): a recipe's product is an item or a part by its product type, and the two tables share
#   ids, while a reference names one table; a recipe page would leave what it makes unnamed. Its ingredients and
#   required character are marked as references in the registry, for when a kind can name its title by a type.
# - The production sets (CRINIT): a region reads set 200 × kind + its value for each of five kinds, and what the kinds
#   are is not decoded. The starting units (USINIT), the brothel's girls (HAINIT, whose records are scene offers), the
#   object kinds (DPINIT, whose names are a map object's kind), the land types, the battlefield maps (MPINIT, on
#   demand), the battle setups (DUINIT, on demand) and the shop's offers (SHINIT, on demand) are machinery.
# - The scenes (SCINIT), the CG gallery (CGINIT), the scene replays (SPINIT), the music room (MUINIT), the strategy
#   screens' help lines (NAINIT), the tutorials (TUINIT), the voice settings (CVINIT), the routines (RTINIT), the battle
#   animations (ANINIT, ANINIT2) and the skill areas (SAINIT).

[export]
# The tables as the game plays with them: INIT2's exit, after the base tables and the append's `$1$AUTORUN`
# (docs/koukaku-data-tables.md, "Boot"). Every boot table's arrays lie above the saved prefix, so none is a save's.
boot = { script = "INIT2", read_at = "koukaku.boot.data_ready" }
# The scripts whose stored values may be published: INIT2 itself, the *INIT and *INIT2 table scripts (ANINIT2) and
# their `$1$` layers, and AUTORUN, which the append runs.
builders = ["INIT2", "*INIT", "*INIT2", "AUTORUN"]
# Never builders, whatever matches them: the CG gallery (CGINIT) and the scene replays (SPINIT).
excluded_builders = ["CGINIT", "SPINIT"]
# No text scripts: every description the information screens show is a table's string array (the items', parts',
# troops', skills', tips' and glossary's lines), read here as text fields. TUMES, the one text script, plays the
# tutorials, which are not a kind.
# The pictures the site shows blurred until a click: nudity, by catalog name. Found by looking at every picture the
# declarations publish (2026-11-26, 1322 pictures): none shows a nipple or a bare bottom, so the list is empty. The
# unit pictures (CB…AA) are faces and shoulders, the small figures (CPC…, CPS…) are sprite sheets, the tips (RUA…)
# screenshots of the interface, and formations and map objects are drawings of shapes, ground and buildings.
# Revealing but covered art (the profile pictures CR003, CR009, CR018, CR021, CR023, CR025, CR037 and $1$CR040, the
# unit picture CB567AA) and the featureless body of the figure in the wall MO925A (the map object 壁２) are not on it.
explicit_pictures = []

[[kind]]
id = "character"
table = "character"
about = "Every person, form and monster that can lead a unit: sex, kind, size and element, starting title and costume, base level and stats, loyalty and costs."
# 406 records have name forms (the speakers); the 386 with a name in lists are the characters.
exists = "name.name"
title = "name.name"
text = ["name.alias", "description"]
fields = [
    "sex", "kind", "size", "element", "initial_title", "initial_costume", "master", "base_level", "level_cap",
    "weeks_per_level", "base_stats", "initial_loyalty", "hiring_cost", "weekly_fee",
]
filters = ["kind", "sex", "element"]
# One person has a record for each of its forms and each side it fights on; they differ by title and level.
qualifiers = ["initial_title", "base_level"]
# The unit picture (CB…AA), and the sheet of the character's small figure in its four facings (CPC…), which the
# 人物 book draws a quarter of.
pictures = { unit = "unit_pictures.0", sprites = "portrait" }

[kind.labels]
"name.alias" = "Also called"
description = "Description"
initial_title = "Starting title"
initial_costume = "Starting costume"
master = "Master"
level_cap = "Highest level (another nation's)"
weeks_per_level = "Weeks a level (another nation's)"
base_stats = "Base stats"
initial_loyalty = "Starting loyalty"
hiring_cost = "Hiring cost"
weekly_fee = "Weekly fee (契約)"

[kind.notes]
"name.alias" = "The name the lists show in its place while the story hides who it is."
base_level = "The level of its base stats, and the level it has when it first joins."
base_stats = "At its base level. One that joins takes them as its own; another nation's grows from them with the weeks."
level_cap = "Another nation's character gains levels with the weeks up to this one."
weeks_per_level = "Another nation's character gains a level every this many weeks."
