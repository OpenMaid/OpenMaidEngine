about = "What stands on the battlefields and in the towns: nature, bridges, barriers, walls, traps, buildings and facilities, their size and building cost."
exists = "name"
title = "name"
text = ["description"]
fields = [
    "kind", "width", "depth", "build_weeks.1", "costs.1", "material_items.4", "material_amounts.4", "material_items.5",
    "material_amounts.5", "material_items.6", "material_amounts.6", "material_items.7", "material_amounts.7", "costs.2",
    "costs.3", "costs.4", "costs.5",
]
filters = ["kind"]
# Objects of one name differ by kind.
qualifiers = ["kind"]
pictures = { picture = "pictures.1" }

[kind.labels]
description = "Description"
width = "Width (cells)"
depth = "Depth (cells)"
"build_weeks.1" = "Weeks to build"
"costs.1" = "Cost"
"material_items.4" = "Material"
"material_amounts.4" = "Amount"
"material_items.5" = "Material"
"material_amounts.5" = "Amount"
"material_items.6" = "Material"
"material_amounts.6" = "Amount"
"material_items.7" = "Material"
"material_amounts.7" = "Amount"
"costs.2" = "Cost at level 2"
"costs.3" = "Cost at level 3"
"costs.4" = "Cost at level 4"
"costs.5" = "Cost at level 5"

[kind.notes]
"material_items.4" = "The materials building it takes, each with its amount; one with no amount is not needed. A higher level's materials are in the modder data."

[kind.referenced_as]
"material_items.4" = { heading = "Material for building", details = ["material_amounts.4"] }
"material_items.5" = { heading = "Material for building", details = ["material_amounts.5"] }
"material_items.6" = { heading = "Material for building", details = ["material_amounts.6"] }
"material_items.7" = { heading = "Material for building", details = ["material_amounts.7"] }

# The script relations (spec §6.7, export plan §4.5): where a script sets a helper's arguments to constants and calls it.
# ADDITEM gives or takes an item by the sign of its count, and ADDPART a part (docs/koukaku-data-tables.md, "The item
# helpers and the inventory"; "ADDPART, the costumes and DOLL").
[[script_relation]]
id = "given_in"
negative = "taken_in"
call = "ADDITEM"
kind = "item"
key = "current_item"
count = "item_count_change"
exclude = ["DEBUG*"]

[[script_relation]]
id = "part_given_in"
negative = "part_taken_in"
call = "ADDPART"
kind = "part"
key = "current_part"
count = "part_count_change"
exclude = ["DEBUG*"]
