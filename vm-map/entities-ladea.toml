# 天秤のLa DEA。's entity declarations: what the project site publishes of the game's data (game data export spec §5).
# Hand-edited; tools/entities_build.py checks it against vm-map/globals-ladea.toml (its tables, their [table.refs], its
# globals), vm-map/patch-points-ladea.toml and the profile's saved prefix, and writes build/games/ladea/entities.json
# for the exporter. The tables are described in docs/ladea-data-tables.md.
#
# The conventions are Kamidori's (vm-map/entities-kamidori.toml), as Verita's, 戦女神ZERO's and 魔導巧殻's are: scripts
# named without the `$n$` prefix and `.BIN`; the story flags and scenes that gate a record left to the modder data; a
# field published when it means something to a player, so sort keys, routines, voices, animations, sound and sprite
# machinery stay modder data; what a value means left to the registry's value facets (words, the game's names, scale);
# and a note only where the label and value leave a reader guessing. A field whose meaning the data document does not
# state, or states only as inferred, is not published.
#
# The game keeps its stats in vectors whose columns the data document names only in part (docs/ladea-data-tables.md,
# CHINIT's 18 stat columns and the 22-stat vector of "Items, stones, improvement and alchemy"). A character's and an
# item's stats are published column by column, the named columns only.
#
# What is not a kind here, and why:
# - The item classes (AFINIT's GS[0x1fd9c], 杖 … 間接): an item's class is a name of the game's list, given by the
#   registry's value facets; the item kind ITINIT's G[0x34aa77] holds (重要アイテム, 必殺・飛燕 …) is the `item_kind`
#   kind. The site shows an item's kind as its "Category" and its class as its "Kind".
# - The improvement table (IMINIT) and the stones' bonus stats: their bonuses name columns of the 22-stat vector, most
#   of which the document does not name. The stones are a kind of their own because IMINIT, DPINIT and ITINIT share
#   ids but no table names the other's records as its own, so a kind cannot join them into the item.
# - The voice settings (CVINIT), the battle routines (RTINIT), the battle animations and effects (BTANINIT2, BTANINIT),
#   a costume's look (COINIT, on demand), the field actions, the formations (AFINIT writes only placeholder lines and
#   no script reads them), the object kinds and atlas markers (OBINIT, OBINIT2), the lands (LAINIT), the block puzzles
#   (PZINIT), the floor's objects (FLINIT, on demand) and the atlas (ATINIT): machinery.
# - The special encounters (ELINIT): an entry has no name, and its scene or battle is a script's. The encounter sets
#   and formations (ENINIT, ESINIT) and the fixed battles (DUINIT) are written on demand. The shops' offers (SHINIT)
#   are written on demand too, and are guarded by story flags.
# - The town's buildings and places (BLINIT) are the town map's drawing, and its spots (ORINIT) are written on demand
#   for the place in play. The unlock board (FMINIT) is the placement of the unlocks, which are a kind.
# - The scenes (SCINIT), the event CG parts (EVINIT), the CG gallery (CGINIT), the scene replays (SPINIT), the music
#   room (MUINIT) and the tutorials (TUINIT, TUMES).

[export]
# The tables as the game plays with them: INIT2's end, after the base tables and the appends' `$1$AUTORUN` and
# `$2$AUTORUN` (docs/ladea-data-tables.md, "Boot"). Every boot table's arrays lie above the saved prefix (G[0xcf2e6],
# GS[0x34f]), so none is a save's.
boot = { script = "INIT2", read_at = "ladea.boot.data_ready" }
# The scripts whose stored values may be published: INIT2 itself, the *INIT and *INIT2 table scripts (BTANINIT2,
# OBINIT2) and their `$1$` and `$2$` layers, and AUTORUN, which each append runs.
builders = ["INIT2", "*INIT", "*INIT2", "AUTORUN"]
# Never builders, whatever matches them: the CG gallery (CGINIT) and the scene replays (SPINIT).
excluded_builders = ["CGINIT", "SPINIT"]
# No text scripts: every description the information screens show is a table's string array (the items', characters',
# special skills', profiles', glossary's, quests' and unlocks' lines), read here as text fields. TUMES plays the
# tutorials, which are not a kind; GSMES and MES are not data.
# The pictures the site shows blurred until a click: nudity, by catalog name. Found by looking at every picture the
# declarations publish (2026-11-26, 1282 pictures: 1119 item icons IT…, 116 stones' large pictures MS…B and 47
# profile portraits VIC…), and listed where a nipple or a bare bottom shows: the profiles of 琉璃王イルン and 魔神
# ムールムール (VIC061AA, VIC064AA), and the stones of イルン (MS1202B), フレイムナーガ (MS1407B), ハルピュア (MS1413B),
# サッキュバス (MS1431B), スキューネイル (MS1437B), ノオース (MS1443B, between her bandages), 精カリシ性ジョ (MS1445B),
# 水獣人ネレナ (MS1450B), 憑魅霊 (MS1613B), 身籠るモノ (MS1614B) and 偽魂艶蛇レプス (the second append's $2$MS1459B).
# The item icons are drawings of things, and a stone's icon shows only its bearer's face. Revealing but covered art
# (the profiles VIC005AA, VIC023AA, VIC039BA, VIC041AA, VIC047AA, VIC050AA, VIC051AA, VIC053AA and VIC060AA, the
# stones MS1430B, MS1440B, $2$MS1456B and $2$MS1457B) and the featureless bodies of the puppets and spirits (MS1424B,
# MS1453B, $2$MS1460B and $2$MS1463B) are not on the list.
explicit_pictures = [
    "VIC061AA", "VIC064AA", "MS1202B", "MS1407B", "MS1413B", "MS1431B", "MS1437B", "MS1443B", "MS1445B", "MS1450B",
    "MS1459B", "MS1613B", "MS1614B",
]

[[kind]]
