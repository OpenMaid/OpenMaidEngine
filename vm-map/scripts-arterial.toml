# What Arterial's scripts do, in words (game data export spec §8.2): hand-written notes that
# tools/reference_bundle.py merges with the committed script index, docs/script-index-arterial.json, into the
# reference bundle's games/arterial/scripts.json. The format is vm-map/scripts-kamidori.toml's. Every note here
# comes from docs/arterial-data-tables.md.

# ---------------------------------------------------------------------------------------------- the boot

[[script]]
name = "INIT2"
summary = """Builds the game's data: it calls the 29 base table scripts (SCINIT first, MUINIT last), then op 0x143 \
runs each mounted append's $n$AUTORUN, whose fragments add records and rewrite cells of earlier ones. It also fills \
the slot arrays that pick a record's script by the append that added it, with the base scripts in slot 0."""
source = "docs/arterial-data-tables.md (How the data gets into memory)"

[[script]]
name = "$1$AUTORUN"
summary = """The first append's record zero, which INIT2 runs through op 0x143: it calls the append's $1$ fragment of \
each of the 29 boot tables, fills the append's slots of the slot arrays, and sets bit 1 of the append mask."""
source = "docs/arterial-data-tables.md (How the data gets into memory)"

[[script]]
name = "$2$AUTORUN"
summary = """The second append's record zero, which INIT2 runs through op 0x143: it calls the append's $2$ fragment \
of each of the 29 boot tables (almost all of them empty stubs), fills the append's slots of the slot arrays, and \
sets bit 2 of the append mask."""
source = "docs/arterial-data-tables.md (How the data gets into memory)"

[[script]]
name = "$3$AUTORUN"
summary = """The third append's record zero, which INIT2 runs through op 0x143: it calls the append's $3$ fragment of \
each of the 29 boot tables, fills the append's slots of the slot arrays, and sets bit 3 of the append mask."""
source = "docs/arterial-data-tables.md (How the data gets into memory)"

[[script]]
name = "$4$AUTORUN"
summary = """The fourth append's record zero, which INIT2 runs through op 0x143: it calls the append's $4$ fragment \
of each of the 29 boot tables, fills the append's slots of the slot arrays, and sets bit 4 of the append mask."""
source = "docs/arterial-data-tables.md (How the data gets into memory)"

# ---------------------------------------------------------------------------------------------- the boot tables
# Each writes its table's records as constants into the global bank, and each append's fragment of it writes over
# them (docs/arterial-data-tables.md, "Table inventory").

[[script]]
name = "SCINIT"
summary = "The scenes: the script each scene id plays. Built at boot."
source = "docs/arterial-data-tables.md (Table inventory; SCINIT)"

[[script]]
name = "CHINIT"
summary = "The characters, as speakers: their names by form, voices and pictures. Built at boot."
source = "docs/arterial-data-tables.md (Table inventory; CHINIT)"

[[script]]
name = "CFINIT"
summary = "The faces: each character's face pictures. Built at boot."
source = "docs/arterial-data-tables.md (Table inventory; CFINIT)"

[[script]]
name = "CCINIT"
summary = """The party characters: the skill lines each starts with, and the cards, skills and 奥義 level of each of \
their levels. Built at boot."""
source = "docs/arterial-data-tables.md (Table inventory; CCINIT)"

[[script]]
name = "CDINIT"
summary = "The cards: 30 slots for each of 200 rows. Built at boot."
source = "docs/arterial-data-tables.md (Table inventory; CDINIT)"

[[script]]
name = "TAINIT"
summary = "The talents, a card's abilities, by name and description. Built at boot."
source = "docs/arterial-data-tables.md (Table inventory; TAINIT, COINIT, SKINIT, ILINIT)"

[[script]]
name = "COINIT"
summary = "The 奥義: 30 of them, each with nine levels. Built at boot."
source = "docs/arterial-data-tables.md (Table inventory; TAINIT, COINIT, SKINIT, ILINIT)"

[[script]]
name = "SKINIT"
summary = "The skills (飛行, 転移, 錬金Ⅰ and the rest). Built at boot."
