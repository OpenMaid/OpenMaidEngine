[[script]]
name = "ITINIT"
summary = "The items. Built at boot."
source = "docs/arterial-data-tables.md (Table inventory; ITINIT)"

[[script]]
name = "IMINIT"
summary = "Card growth: what each of up to eight level steps adds to four of a card's numbers. Built at boot."
