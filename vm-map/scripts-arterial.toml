# ---------------------------------------------------------------------------------------------- tables on demand

[[script]]
name = "BGINIT"
summary = """Picture substitution: for the picture id in adv_face_id and the time of day in time_slot (0 to 4), it \
leaves another picture id in adv_face_id. Run on demand."""
source = "docs/arterial-data-tables.md (On-demand tables)"
[script.arguments]
adv_face_id = "the picture id to substitute; the script leaves its substitute there"
time_slot = "the time of day, 0 to 4, that picks the substitute"

[[script]]
name = "MPINIT"
summary = """The points of the area in play: their names, kinds and positions, and where a point leads. It clears \
its arrays and fills them from the branch for current_area_id; SETMAPDATA runs it, then each append's."""
source = "docs/arterial-data-tables.md (On-demand tables)"
[script.arguments]
current_area_id = "the area in play, an AMINIT id"

[[script]]
name = "ROINIT"
summary = """The routes between the area's points. It clears its arrays and fills them from the branch for \
current_area_id; SETMAPDATA runs it, then each append's."""
source = "docs/arterial-data-tables.md (On-demand tables)"
[script.arguments]
current_area_id = "the area in play, an AMINIT id"

[[script]]
name = "UNINIT"
summary = """The units on the area in play: a card each, and nineteen more arrays. It clears its arrays and fills \
them from the branch for current_area_id; SETMAPDATA runs it, then each append's."""
source = "docs/arterial-data-tables.md (On-demand tables)"
[script.arguments]
current_area_id = "the area in play, an AMINIT id"

# ---------------------------------------------------------------------------------------------- the game

[[script]]
name = "SETMAPDATA"
summary = """Loads the area in play: it runs the slot arrays of MPINIT, ROINIT and UNINIT, slots 0 to 31, so the base \
table and then each append's fill the area's points, routes and units."""
source = "docs/arterial-data-tables.md (How the data gets into memory; On-demand tables)"
