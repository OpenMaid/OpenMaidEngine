# ---------------------------------------------------------------------------------------------- the game

[[script]]
name = "FIELD"
summary = """The dungeon floor: it runs every layer's map and stage loaders, places the floor's enemies and objects, \
and runs each layer's ready handlers, a round's handlers at the start of each player turn after the first, and the \
close handlers when the floor ends."""
source = "the patch points kamidori.stage.after_loader, after_ready_handlers, after_round_handlers and after_close_handlers"

[[script]]
name = "SELSTAGE"
summary = """The stage list, the world map's choice of a floor: it puts the stage under its cursor in \
current_stage_id and runs that stage's loaders for its preview, which shows the enemy slots whose gates pass. \
Nothing is placed."""
source = "the patch point kamidori.stage.after_list_preview"

[[script]]
name = "INFO3"
summary = """INFO's third tab, アイテム情報, which FIELD opens from its menu. For an item's 獲得地点 view it runs every \
stage's loaders to find the floors whose dig points yield it, then, on a floor, runs that floor's loaders again."""
source = "the patch point kamidori.stage.after_info_reload"

[[script]]
name = "ADDEXP"
summary = """Awards experience to one character: the amount its caller passes (COMMITBTL after a battle, or FIELD), \
times the costume bonus, over 100. A character at its level cap, or an amount of 0 or less, gains none. Weapon \
experience is decided after."""
source = "the patch point kamidori.experience.after_calculation"
[script.arguments]
current_battle_slot = "the battle slot whose unit gains the experience (ADDEXP@0x0 reads battle_unit_unit_ids by it)"
shared_scratch_value = "the experience its caller awards"
