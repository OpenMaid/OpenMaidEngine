# What Kamidori's scripts do, in words (game data export spec §8.2): hand-written notes that
# tools/reference_bundle.py merges with the committed script index, docs/script-index-kamidori.json, into the
# reference bundle's games/kamidori/scripts.json.
#
# Each [[script]] names a script as the index has it, without `.BIN` (`ITINIT`, `$1$AUTORUN`), and gives:
#   summary    what the script does, in a sentence or two;
#   source     where the fact is established (a doc of this repository, a patch point);
#   arguments  optional: each global the script reads as an input its caller sets, and what it means. A global
#              here must be a name of vm-map/globals-kamidori.toml that the index shows the script using.
# The core gate `reference-bundle-check` refuses a note whose script the index lacks, or an argument the script
# does not use. A layer's script ($n$NAME) gets the base script's note on the site through the bundle's
# `layer_of`; give it its own note only where it does something else.

# ---------------------------------------------------------------------------------------------- the boot

[[script]]
name = "INIT2"
summary = """Builds the game's data: it calls the 28 base table scripts (SCINIT first, BTANINIT2 last), then op \
0x143 runs each mounted append's $n$AUTORUN, whose fragments write over the base tables. After that it fills each \
unset text colour, rebuilds the field when a save made on a floor is loaded, and sets up the studio's ornaments."""
source = "docs/kamidori-data-tables.md (How the data gets into memory); the patch points kamidori.boot.data_layered and kamidori.boot.data_ready"

[[script]]
name = "$1$AUTORUN"
summary = """The first append's record zero, which INIT2 runs through op 0x143: it calls the append's $1$ fragment of \
each of the 28 boot tables, in INIT2's order."""
source = "docs/kamidori-data-tables.md (How the data gets into memory)"

[[script]]
name = "$2$AUTORUN"
summary = """The second append's record zero, which INIT2 runs through op 0x143: it calls the append's $2$ fragment \
of each of the 28 boot tables, in INIT2's order."""
source = "docs/kamidori-data-tables.md (How the data gets into memory)"

[[script]]
name = "$3$AUTORUN"
summary = """The third append's record zero, which INIT2 runs through op 0x143: it calls the append's $3$ fragment of \
each of the 28 boot tables, in INIT2's order."""
source = "docs/kamidori-data-tables.md (How the data gets into memory)"

