# ---------------------------------------------------------------------------------------------- tables on demand

[[script]]
name = "STINIT"
summary = """The per-stage loader: it writes the tables of the stage in current_stage_id (its enemy and ally slots, \
objects and rules), which FIELD, SELSTAGE's preview and INFO3 run before they read them. It is reached through \
stage_loader_script_ids, each layer's loader in turn, not by a constant call."""
source = "docs/kamidori-data-tables.md (Stage catalog and per-stage loader); the patch point kamidori.stage.after_loader"
[script.arguments]
current_stage_id = "the stage whose tables it writes"

[[script]]
name = "MPINIT"
summary = """The dungeon floor maps: it writes the map of the floor current_labyrinth_id and current_floor_no select \
into the 53×53 floor_terrain_template, with the floor's size. Labyrinth -1 holds the battle maps outside the \
dungeons."""
source = "docs/kamidori-data-tables.md (How a dungeon floor is stored)"
[script.arguments]
current_labyrinth_id = "the labyrinth of the floor to load"
current_floor_no = "the floor to load"

[[script]]
name = "CCINIT"
summary = """The class-change rules: CALCCC calls it, and each layer's, through its hook array. A rule that matches \
the character and its level sets its bit, takes its title when its priority wins, and adds its deltas."""
source = "docs/kamidori-data-tables.md (Class changes)"
[script.arguments]
current_character_id = "the character whose rules it tests"

