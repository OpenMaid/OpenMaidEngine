treasure_current_id = "the treasure to give, a TRINIT id"

# ---------------------------------------------------------------------------------------------- battle

[[script]]
name = "SETENP"
summary = """Sets up a battle's enemies. Unless a script has set the two formations itself, it draws an entry of the \
encounter set in play, by weight, among those whose window fits the field gauge. For each formation it runs ESINIT \
($1$ESINIT in 特別編, and ESINIT where that loaded nothing), places each enemy on a free cell of its range, runs SETEN for it, and sets the bit that \
puts it under its routine."""
source = "docs/bg0-data-tables.md (Battle, enemies and routines; ENINIT; ESINIT; RTINIT)"

[[script]]
name = "SETEN"
summary = """Builds an enemy's battle slot from its EBINIT unit, which it reads live. The level is the block's base \
level from RMINIT plus part of the party's average-level lead, held between the unit's base and highest level, then \
moved by a draw within the block's spread; in the arena it is the round's."""
source = "docs/bg0-data-tables.md (Units, characters and speakers; EBINIT; The world; RMINIT; Battle, enemies and routines; ARINIT)"
