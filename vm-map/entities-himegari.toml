can_affect_bosses = "Without it, a boss is immune."
cleared_by_recover = "Recovery items and magic reset it to what the unit's equipment and skills give."
levels = "Each level's turns, its stat changes, and its HP, SP and FS changes each turn: a drain's are what it takes, poison's a loss."

