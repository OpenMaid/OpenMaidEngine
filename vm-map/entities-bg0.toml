# 戦女神ZERO's entity declarations: what the project site publishes of the game's data (game data export spec §5).
# Hand-edited; tools/entities_build.py checks it against vm-map/globals-bg0.toml (its tables, their [table.refs], its
# globals), vm-map/patch-points-bg0.toml and the profile's saved prefix, and writes build/games/bg0/entities.json for
# the exporter. The tables are described in docs/bg0-data-tables.md.
#
# The conventions are Kamidori's (vm-map/entities-kamidori.toml), as Verita's are: scripts named without the `$n$`
# prefix and `.BIN`; the story flags and scenes that gate a record left to the modder data; a field published when it
# means something to a player, so sort keys, routines, voices, animations, sound and sprite machinery stay modder data;
# what a value means left to the registry's value facets (words, the game's names, scale); and a note only where the
# label and value leave a reader guessing. A field whose meaning the data document does not state is not published.
#
# What is not a kind here, and why:
# - The characters: every array of the `character` table lies below the saved prefix, and INIT, not INIT2, runs
#   CHINIT, so at the boot's end the table is empty. An item's exclusive users and an arena round's required
#   characters name characters, so they stay modder data too.
# - The world map's areas, the town sites and the field maps' blocks: AMINIT, SIINIT and RMINIT fill them for the
#   place in play only, and at boot no place is in play (AMINIT and SIINIT only clear). The field maps' floors are
#   MPINIT's, a boot table, and are the `map` kind.
# - The scenes, the CG gallery (CGINIT) and the scene replays (SPINIT); the speakers, セリカ's forms (CBINIT), the
#   battle routines, animations and encounters, the land types, the map objects and the field sheets, which are
#   machinery.

[export]
# The tables as the game plays with them: INIT2's exit, after the base tables and the append's `$1$AUTORUN`
# (docs/bg0-data-tables.md, "How the data gets into memory"). The game mode is 0 at a cold boot, so this is the
# 通常 game's data: the guarded `$1$AMINIT`, `$1$SIINIT` and `$1$SCINIT` do not run.
boot = { script = "INIT2", read_at = "bg0.boot.data_ready" }
# The scripts whose stored values may be published: INIT2 itself, the *INIT and *INIT2 table scripts (BTANINIT2,
# OBINIT2) and their `$1$` layers, and AUTORUN, which the append runs.
builders = ["INIT2", "*INIT", "*INIT2", "AUTORUN"]
# Never builders, whatever matches them: the CG gallery (CGINIT) and the scene replays (SPINIT).
excluded_builders = ["CGINIT", "SPINIT"]
# No derived scripts: INIT2's CALCREVISE runs only for a character who has joined (character_flags bit 0, a saved
# cell, 0 at a cold boot; INIT2@0xb9..0xeb).
# The information screens whose shown text is data: the item descriptions (ITMES, which branches on the item's
# category and id, ITMES@0x6) and the glossary (VIMES, which branches on glossary_current_entry, VIMES@0x6), and the
# 人物 book's text (CIMES, which branches on profile_shown, CIMES@0x6; INFO2@0xeae runs it, and the append has no
# layer of it).
# The item screens run ITMES and then the append's `$1$ITMES` with the same current_item (CHMODE1@0x27ac..0x27af,
# INFO4@0x10d8, SHOP@0x136e; SYSTEM4@0x23e..0x248 preloads them into slots 0x1b and 0x1d). A description runs the base
# script alone, so the 52 weapons and armour `$1$ITINIT` adds (1011 onward), whose text is in `$1$ITMES` only, have
# none here, as Verita's appended records have none.
text_scripts = ["ITMES", "VIMES", "CIMES"]
# The pictures the site shows blurred until a click: nudity, by catalog name. Found by looking at every picture the
# declarations publish (2026-11-25, 528 pictures), and listed where a nipple or a bare bottom shows: the topless
# エカティカ (CD110A, her battle figure CPB110A and status picture CS110AA), リ・クティナ (CD220A, CS220AA, CS220ZZ) and
# the two naga warriors (CD221A, CD222A), the nagas' battle figures (CPB220A to CPB222A), the nude beastfolk girls
# (CD227A to CD229A, CPB227A to CPB229A), the nude angels (CD350A to CD352A, CD360A, CD361A and their battle figures
# CPB350A to CPB352A, CPB360A, CPB361A), the succubi クルージェ, the 睡魔サッキュバス and 人攫いの睡魔 (CD474A, CD481A,
# CD483A, CPB474A, CPB481A, CPB483A), ファナガル's women (CD680A) and the glossary's 性魔術 (CI502N). Their small figures
# CPB224A and CPB680A show none of it. Revealing but covered art (the tribe's warriors CD111A, CD112A and CD115A,
# ペルル in CD240A and $1$CD637A, the succubi CD470A to CD473A and CD480A, CS480AA, CD902A, CD904A, CS001CA, CS003ZZ,
# CS106AA, the glossary's CI502C) and the featureless bodies of ヴィーヴル and the water spirit (CD236A, CPB236A, CD315A,
# CPB315A) are not on the list.
explicit_pictures = [
    "CD110A", "CPB110A", "CS110AA", "CD220A", "CS220AA", "CS220ZZ", "CD221A", "CD222A", "CPB220A", "CPB221A",
    "CPB222A", "CD227A", "CD228A", "CD229A", "CPB227A", "CPB228A", "CPB229A", "CD350A", "CD351A", "CD352A", "CD360A",
    "CD361A", "CPB350A", "CPB351A", "CPB352A", "CPB360A", "CPB361A", "CD474A", "CD481A", "CD483A", "CPB474A",
    "CPB481A", "CPB483A", "CD680A", "CI502N",
]

