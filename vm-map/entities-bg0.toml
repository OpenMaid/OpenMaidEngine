# The script relations (spec §6.7, export plan §4.5): where a script sets a helper's arguments to constants and calls it.
# ADDITEM gives or takes an item by the sign of its count (docs/bg0-data-tables.md, "The item helpers and the
# inventory").
[[script_relation]]
id = "given_in"
negative = "taken_in"
call = "ADDITEM"
kind = "item"
key = "current_item"
count = "item_count_change"
exclude = ["DEBUG*"]
