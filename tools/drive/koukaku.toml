# Driving facts for 魔導巧殻, read by tools/drive.py for both targets (native AGE and the port).
# Points are native client pixels of the 1280x720 canvas (SYS4INI SCREENX, SCREENY). Its engine is AGE 4.43B
# (SYS4443), whose EngineCtx is laid out differently from Himegari's (vm-map/engine-ctx.toml describes Himegari's), so
# the native field offsets are given here. Evidence: docs/engine-re.md, "Driving native AGE" and "Arterial against
# 魔導巧殻, triaged".

[advance]
point = "adv.next"        # where `advance` clicks: the middle of the canvas

# The title's entries, read from native on 2026-11-26 (the title shows "Version 1.03.0010" and "AP01 北方の超剛力軍DISC
# 追加"): five buttons in a row, each point on its words.
[points]
"adv.next" = [640, 360]
"title.start" = [160, 560]       # Game Start (開始)
"title.load" = [400, 560]        # Load Data (再開)
"title.room" = [640, 560]        # EU-Room (回想)
"title.option" = [880, 560]      # Option (環境設定)
"title.quit" = [1120, 560]       # Quit (終了)
# GAMESTART's initial settings (初期設定), read from native on 2026-11-26: difficulty, carry-over and other-nation
# modes, then ゲーム開始 starts the game (the PROLOGUE movie, then SC0000).
"start.begin" = [995, 475]       # ゲーム開始
"start.back" = [937, 525]        # 戻る
# SC0000's first choice box (BUNKI, チュートリアルを受けますか？), two rows.
"choice.1" = [640, 325]          # 受ける
"choice.2" = [640, 395]          # 受けない
# The ADV menu a right click opens (MENU, a wheel of orbs) and the save screen (SAVE), read from native on 2026-11-26.
# A right click on the save screen returns to the page.
"menu.save" = [540, 325]         # セーブ
"menu.load" = [740, 325]         # ロード
"slot.0" = [540, 108]            # slot 000 of the first page of ten
"slot.0.comment" = [215, 120]    # コメント編集 on a saved slot: op 0x144, AGERC's dialog 10
"confirm.yes" = [640, 325]       # はい of セーブしますか？ and ロードしますか？

# Settings written into a sandbox profile's SYS4REG.INI before every sandboxed launch (as for the other games).
[sandbox]
settings_file = "SYS4REG.INI"

[sandbox.settings]
"display.ScreenMode" = 1
"display.VirtualFullScreen" = 1

[sandbox.quiet]
"sound.Volume0" = 0

# Native AGE only. The [native.*] tables are for the install's AGE.EXE, AGE 4.43B; its unpacked image is
# build/games/koukaku/engine-dump (Ghidra /koukaku/4.43B). Each value was found on 2026-11-26 from 創刻のアテリアル's by
# its code:
# - g_pEngineCtx is 0x670818: the main routine calls engine_ctx_construct@0x414f70 at 0x4a828e and stores the result
#   there at 0x4a829a (mov [0x670818], eax), and the window procedure reads the ctx through it.
# - The interpreter's frame record keeps the other builds' layout from cur_ctx_index (codebase +0x14, pc +0x18,
#   resource id +0x50): every handler stores its instruction length at ctx+0x5d4c4 + curCtx*0x78 (cur_ctx_index
#   +0x74, as 4.38D's ctx+0x5d48c is ctx+0x5d418 +0x74), and the operand accessors index by ctx+0x5d450.
[native.engine]
ctx_global = 0x670818
frame_stride = 0x78
frame_count = 20
cur_ctx_index = 0x5d450
frame_codebase = 0x5d464
frame_pc = 0x5d468
frame_script_resource_id = 0x5d4a0

# input_set_polling_enabled is 0x473c70, byte for byte 4.38D's 0x471040 (input manager +0x1820, the manager at
# ctx+0x408, so the gate is ctx+0x1c28). The window procedure's WM_ACTIVATE case calls it at 0x4a7017 and returns to
# 0x4a701c: of the setter's five calls it is the one with 4.38D's call-site bytes (test ebx, ebx; sete; push; the
# others push 0 or 1).
[native.keep_polling]
setter = 0x473c70
activate_return = 0x4a701c
gate = 0x1c28

# The drive step rand-seed replaces op 0x60's rand() draw at the instruction its call returns to: op 0x60's handler
# at 0x42acd0 calls _rand@0x5f3ee5 (the MSVC generator, by its 0x343fd multiplier) at 0x42ad0a, before it fetches an
# operand, as 4.38D's does.
[native.rand]
op60_rand_return = 0x42ad0f

[native.build."4.43B"]
sha256 = "3ce8ae6f17fdc77ec4137a7266f5b61f00e74349c416272003c61458d96760f9"   # packed, as installed

[[native.dialog]]
match = "データが壊れています．"
answer = "yes"
reason = "registration check (set:IsReggist == 0) on copied installs; Yes continues, No exits"
# Not seen on 魔導巧殻's scratch copy (2026-11-26); kept, as the other games' configs keep it, in case it appears.
