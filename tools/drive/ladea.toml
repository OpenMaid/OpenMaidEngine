# Driving facts for 天秤のLa DEA。, read by tools/drive.py for both targets (native AGE and the port).
# Points are native client pixels of the 1280x720 canvas (SYS4INI SCREENX, SCREENY). Its engine is AGE 4.45D
# (SYS4445), whose EngineCtx is laid out differently from Himegari's (vm-map/engine-ctx.toml describes Himegari's), so
# the native field offsets are given here. Evidence: docs/engine-re.md, "Driving native AGE" and "魔導巧殻 against
# 天秤のLa DEA。, triaged".

[advance]
point = "adv.next"        # where `advance` clicks: the middle of the canvas

# The title's entries, read from native on 2026-11-26 (the title shows "Version 2.00.0011", "野牛の蹄 亭 秘密部屋DISC
# 追加" and "ビジュアルファンブック Ver2.0 追加"): five buttons in a row, each point on its words.
[points]
"adv.next" = [640, 360]
"title.start" = [160, 620]       # Game Start (開始)
"title.load" = [400, 620]        # Load Data (再開)
"title.room" = [640, 620]        # EU-Room (回想)
"title.option" = [880, 620]      # Option (環境設定)
"title.quit" = [1120, 620]       # Quit (終了)
# GAMESTART's initial settings (初期設定), read from native on 2026-11-26: difficulty, tutorial and enemy strength,
# the replay settings and the carry-over; ゲーム開始 starts the game at SC0000.
"start.begin" = [1005, 638]      # ゲーム開始
"start.reset" = [1183, 638]      # 初期化
# The ADV page's right click opens CONFIG, the game's option screen, whose tabs lead to SAVE (both read from native on
# 2026-11-26): データセーブ and データロード, a slot of the first ten, and SBUNKI's はい.
"menu.save" = [537, 52]          # データセーブ
"menu.load" = [687, 52]          # データロード
"slot.0" = [490, 182]            # SAVE/LOAD 000
"slot.1" = [490, 232]            # SAVE/LOAD 001
"confirm.yes" = [660, 325]       # セーブしますか？ / ロードしますか？ はい

# Settings written into a sandbox profile's SYS4REG.INI before every sandboxed launch (as for the other games).
[sandbox]
settings_file = "SYS4REG.INI"

[sandbox.settings]
"display.ScreenMode" = 1
"display.VirtualFullScreen" = 1

[sandbox.quiet]
"sound.Volume0" = 0

# Native AGE only. The [native.*] tables are for the install's AGE.EXE, AGE 4.45D, which is not packed; its image is
# build/games/ladea/engine-dump, taken back to its preferred base 0x400000 (Ghidra /ladea/4.45D). Windows loads this
# build where its relocations allow (0x5a0000 when it was dumped), so the agent rebases each address below by the
# module's base at run time. Each value was found on 2026-11-26 from 魔導巧殻's by its code:
# - g_pEngineCtx is 0x670990: the main routine calls engine_ctx_construct@0x415320 at 0x4a8eae and stores the result
#   there (mov [0x670990], eax), and the window procedure reads the ctx through it.
# - The interpreter's frame record keeps the other builds' layout from cur_ctx_index (codebase +0x14, pc +0x18,
#   resource id +0x50): every handler stores its instruction length at ctx+0x5d7fc + curCtx*0x78 (cur_ctx_index
#   +0x74), and the operand accessors index by ctx+0x5d788.
[native.engine]
ctx_global = 0x670990
frame_stride = 0x78
frame_count = 20
cur_ctx_index = 0x5d788
frame_codebase = 0x5d79c
frame_pc = 0x5d7a0
frame_script_resource_id = 0x5d7d8

# input_set_polling_enabled is 0x4741f0, 4.43B's 0x473c70 with the gate moved: input manager +0x1a60, the manager at
# ctx+0x408, so the gate is ctx+0x1e68. The window procedure's WM_ACTIVATE case calls it at 0x4a7c37 and returns to
# 0x4a7c3c: of the setter's five calls it is the one with 4.43B's call-site bytes (test ebx, ebx; sete; push; the
# others push 0 or 1).
[native.keep_polling]
setter = 0x4741f0
activate_return = 0x4a7c3c
gate = 0x1e68

# The drive step rand-seed replaces op 0x60's rand() draw at the instruction its call returns to: op 0x60's handler
# at 0x42b480 calls _rand@0x5f4c05 (the MSVC generator, by its 0x343fd multiplier) at 0x42b4ba, before it fetches an
# operand, as 4.43B's does.
[native.rand]
op60_rand_return = 0x42b4bf

[native.build."4.45D"]
sha256 = "815c0a63df0fd68529abd3daa77c704f674b98ddb5abdd105d1e3508f948c05d"   # not packed, as installed

[[native.dialog]]
match = "データが壊れています．"
answer = "yes"
reason = "registration check (set:IsReggist == 0) on copied installs; Yes continues, No exits"
# Kept, as the other games' configs keep it, in case it appears on a scratch copy.
