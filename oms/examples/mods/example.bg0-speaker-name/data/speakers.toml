# Applied at bg0.data.layered, at each boot and each load. A page's name plate is the speaker's CNINIT name,
# speaker_entry[<id>].name, which the scene's speaker id (adv_speaker_id) picks when the page is shown. The game does
# not save the names, so the edit lasts while the mod is enabled, in a new game and in a loaded one. The comment gives
# the game's own value. Speakers 2 and 4 are セリカ too, by the same name; the opening scene's lines are speaker 1's.

[speaker_entry.1]                       # セリカ
name = "[MOD] セリカ"                    # セリカ
