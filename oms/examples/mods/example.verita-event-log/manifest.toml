omp = 3
id = "example.verita-event-log"
name = "Event log (Verita)"
version = "1.0.0"
description = "Logs every event Verita's base mod raises, with its fields, to diagnostics/lua.log and to a list the console reads, and gives the party one 治癒の水・小 (item 101) at each verita.data.ready through the base mod's helper."

[game]
profile = "verita"
target = "extended"

[lua]
api = 1

[[requires]]
id = "verita-base"
version = ">=1.0, <2"

[[hooks]]
event = "verita.data.layered"
handler = "event_log.lua:on_event"

[[hooks]]
event = "verita.data.ready"
handler = "event_log.lua:on_event"

[[hooks]]
event = "verita.map.loaded"
handler = "event_log.lua:on_event"

[[hooks]]
event = "verita.experience.award"
handler = "event_log.lua:on_event"
